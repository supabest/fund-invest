  <!-- 装饰点 -->
  <circle cx="180" cy="340" r="12" fill="#A87C2E"/>
  <circle cx="230" cy="360" r="12" fill="#A87C2E"/>
  <circle cx="280" cy="300" r="12" fill="#A87C2E"/>
