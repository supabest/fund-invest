<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>定投信号台</title>

<!-- Apple Touch Icon - 添加到主屏幕的图标 -->
<link rel="apple-touch-icon-preconnect" href="icon-180.png">
<link rel="apple-touch-icon-preconnect" href="icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="apple-touch-icon" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" sizes="512x512" href="icon-512.png">

<!-- Web App 模式配置 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root{
    --ink:#FAF8F2;
    --panel:#FFFFFF;
    --panel-2:#F1EDE3;
    --line: rgba(27,36,54,0.10);
    --line-strong: rgba(27,36,54,0.20);
    --ivory:#1B2436;
    --muted:#707C8C;
    --gold:#A87C2E;
    --gold-dim: rgba(168,124,46,0.12);
    --jade:#3F8A68;
    --jade-dim: rgba(63,138,104,0.12);
    --brick:#B14A34;
    --brick-dim: rgba(177,74,52,0.12);
    --serif: "Songti SC","STSong","Noto Serif SC", serif;
    --sans: "PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--ink);color:var(--ivory);font-family:var(--sans);
    -webkit-font-smoothing:antialiased; font-variant-numeric: tabular-nums;}
  body{padding-bottom:80px;}
  ::selection{background:var(--gold-dim);}

  .masthead{padding:28px 18px 18px; border-bottom:1px solid var(--line-strong);}
  .masthead-top{display:flex; justify-content:space-between; align-items:baseline;}
  .masthead h1{font-family:var(--serif); font-weight:600; font-size:22px; margin:0; letter-spacing:0.5px;}
  .masthead .date{font-size:12px; color:var(--muted);}
  .goal-row{display:flex; gap:22px; margin-top:18px; flex-wrap:wrap;}
  .goal-stat{flex:1; min-width:110px;}
  .goal-stat .num{font-size:26px; font-weight:600; line-height:1.1;}
  .goal-stat .lbl{font-size:12px; color:var(--muted); margin-top:4px;}
  .progress-track{height:4px; background:var(--panel-2); border-radius:2px; margin-top:14px; overflow:hidden;}
  .progress-fill{height:100%; background:var(--gold); border-radius:2px; transition:width .4s ease;}

  .section{padding:20px 18px;}
  .section-title{font-family:var(--serif); font-size:16px; color:var(--ivory); margin:0 0 12px 0; display:flex; justify-content:space-between; align-items:center;}
  .section-title .hint{font-size:11.5px; color:var(--muted); font-weight:400; font-family:var(--sans);}

  .theme-table{width:100%; border-collapse:collapse; font-size:13px;}
  .theme-table th{text-align:left; font-weight:400; color:var(--muted); font-size:11.5px; padding:0 0 8px 0; border-bottom:1px solid var(--line);}
  .theme-table td{padding:9px 0; border-bottom:1px solid var(--line); vertical-align:middle;}
  .theme-table td:last-child, .theme-table th:last-child{text-align:right;}
  .theme-bar{width:100%; height:6px; background:var(--panel-2); border-radius:3px; overflow:hidden; margin-top:4px; position:relative;}
  .theme-bar-fill{height:100%; border-radius:3px; background:var(--jade);}
  .theme-bar-fill.over{background:var(--brick);}
  .theme-name{font-weight:500;}
  .theme-pct{font-variant-numeric: tabular-nums;}
  .over-tag{color:var(--brick); font-size:11px; margin-left:6px;}

  .fund-card{background:var(--panel); border:1px solid var(--line); border-radius:10px; margin-bottom:12px; overflow:hidden;}
  .fund-head{display:flex; justify-content:space-between; align-items:center; padding:14px 16px; cursor:pointer;}
  .fund-head-left{flex:1; min-width:0;}
  .fund-name{font-size:15px; font-weight:600;}
  .fund-meta{font-size:11.5px; color:var(--muted); margin-top:3px;}
  .fund-return{font-size:15px; font-weight:600; margin-left:12px; white-space:nowrap;}
  .ret-pos{color:var(--jade);}
  .ret-neg{color:var(--brick);}
  .chevron{margin-left:10px; color:var(--muted); font-size:12px; transition:transform .2s ease;}
  .chevron.open{transform:rotate(90deg);}

  .signal-strip{display:flex; align-items:center; gap:8px; padding:0 16px 14px 16px;}
  .signal-pill{font-size:12px; padding:4px 10px; border-radius:20px; font-weight:600; white-space:nowrap;}
  .pill-double{background:var(--gold-dim); color:var(--gold);}
  .pill-strong{background:var(--jade-dim); color:var(--jade);}
  .pill-normal{background:var(--panel-2); color:var(--ivory);}
  .pill-half{background:rgba(180,150,90,0.14); color:#C7A15E;}
  .pill-pause{background:var(--brick-dim); color:var(--brick);}
  .signal-amount{font-size:12px; color:var(--muted);}
  .signal-reason{font-size:11.5px; color:var(--muted); padding:0 16px 14px 16px; line-height:1.6;}

  .dual-strip{display:flex; align-items:center; gap:8px; padding:0 16px 6px 16px; flex-wrap:wrap;}
  .dual-tag{font-size:11px; color:var(--muted); border:1px dashed var(--line-strong); border-radius:4px; padding:2px 6px; white-space:nowrap;}
  .dual-amt{font-size:12px; color:var(--muted);}

  .fund-body{border-top:1px solid var(--line); padding:16px; display:none;}
  .fund-body.open{display:block;}
  .field-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px 12px;}
  .field{display:flex; flex-direction:column; gap:4px;}
  .field.full{grid-column:1/-1;}
  .field label{font-size:11px; color:var(--muted);}
  .field input, .field select{background:var(--panel-2); border:1px solid var(--line); color:var(--ivory);
    padding:8px 9px; border-radius:6px; font-size:13px; font-family:var(--sans); width:100%;}
  .field input:focus, .field select:focus{outline:none; border-color:var(--gold);}
  .checkline{display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--ivory); margin-top:2px;}
  .checkline input{width:auto;}

  .divider-label{font-size:11px; color:var(--muted); margin:16px 0 8px 0; padding-top:12px; border-top:1px solid var(--line);}

  .resume-box{background:var(--panel-2); border-radius:8px; padding:12px; margin-top:10px; font-size:12px; color:var(--muted); line-height:1.7;}
  .resume-box strong{color:var(--ivory);}

  .btn-row{display:flex; gap:8px; margin-top:14px;}
  .btn{flex:1; padding:10px; border-radius:7px; border:1px solid var(--line-strong); background:transparent; color:var(--ivory); font-size:13px; cursor:pointer; font-family:var(--sans);}
  .btn.primary{background:var(--gold); border-color:var(--gold); color:#241a05; font-weight:600;}
  .btn.danger{border-color:var(--brick); color:var(--brick);}
  .btn.ghost{color:var(--muted);}

  .profit-alert{margin-top:10px; padding:10px 12px; background:var(--gold-dim); border-radius:7px; font-size:12px; color:var(--gold); line-height:1.6;}

  .add-fund-btn{width:100%; padding:14px; border-radius:10px; border:1px dashed var(--line-strong); background:transparent; color:var(--muted); font-size:13px; cursor:pointer; font-family:var(--sans); margin-top:6px;}

  .add-stock-btn{width:100%; padding:14px; border-radius:10px; border:1px dashed var(--line-strong); background:transparent; color:var(--muted); font-size:13px; cursor:pointer; font-family:var(--sans); margin-top:6px;}

  .empty{text-align:center; padding:40px 20px; color:var(--muted); font-size:13px; line-height:1.8;}

  .modal-backdrop{position:fixed; inset:0; background:rgba(0,0,0,0.55); display:none; align-items:flex-end; justify-content:center; z-index:50;}
  .modal-backdrop.open{display:flex;}
  .modal{background:var(--panel); border-top-left-radius:16px; border-top-right-radius:16px; width:100%; max-width:520px; max-height:88vh; overflow-y:auto; padding:20px 18px 24px;}
  .modal h2{font-family:var(--serif); font-size:17px; margin:0 0 16px 0;}

  .toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--panel-2); border:1px solid var(--line-strong); padding:10px 18px; border-radius:20px; font-size:12.5px; color:var(--ivory); z-index:60; opacity:0; transition:opacity .25s ease; pointer-events:none;}
  .toast.show{opacity:1;}

  .small-note{font-size:11px; color:var(--muted); margin-top:6px; line-height:1.6;}

  .mkt-strip{display:flex; align-items:center; gap:10px; margin-top:14px; font-size:12px; color:var(--muted); flex-wrap:wrap;}
  .mkt-strip .signal-pill{font-size:11.5px;}
  .mkt-text{flex:1; min-width:0;}
  .mkt-items{display:flex; flex-wrap:wrap; gap:8px 14px; align-items:center; flex:1; min-width:0;}
  .mkt-item{display:inline-flex; align-items:center; gap:5px;}
  .mkt-label{white-space:nowrap; color:var(--ivory);}

  .tabs-row{display:flex; gap:8px; padding:16px 18px 0;}
  .tab-btn{flex:1; padding:11px; border:1px solid var(--line-strong); background:var(--panel); border-radius:8px; font-size:14px; cursor:pointer; font-family:var(--sans); color:var(--muted);}
  .tab-btn.active{background:var(--gold); color:#241a05; font-weight:600; border-color:var(--gold);}
  .settings-row{display:flex; align-items:center; gap:8px; flex-wrap:wrap; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin-bottom:12px; font-size:12.5px; color:var(--muted);}
  .settings-row input{width:140px; background:var(--panel-2); border:1px solid var(--line); border-radius:6px; padding:7px 9px; font-size:13px; color:var(--ivory); font-family:var(--sans);}
  .stock-alert{margin:0 16px 10px 16px; padding:8px 12px; background:var(--brick-dim); border-radius:7px; font-size:12px; color:var(--brick); line-height:1.6;}
  .stock-meta{font-size:11.5px; color:var(--muted); margin-top:3px;}

  /* 量化评分（stock_score 批次）：Top10 区块 / 持仓胶囊 / 四因子明细 */
  .score-card-title{font-family:var(--serif); font-size:14px; color:var(--ivory); font-weight:600; padding:14px 16px 4px;}
  .score-row{display:flex; align-items:center; gap:8px; padding:8px 16px; font-size:13px; flex-wrap:wrap;}
  .score-row:nth-child(odd){background:var(--panel-2);}
  .score-card-note{font-size:11px; color:var(--muted); line-height:1.6; padding:10px 16px 14px;}
  .score-pill{background:var(--jade-dim); color:var(--jade); font-size:11.5px; padding:3px 10px; border-radius:20px; font-weight:600; white-space:nowrap;}
  .score-pill-warn{color:var(--gold);}
  .score-detail{background:var(--panel-2); border-radius:10px; padding:12px; margin-bottom:14px;}
  .score-detail .score-summary{font-size:11.5px; color:var(--muted); margin-top:8px; line-height:1.8;}
  .score-detail .score-src{font-size:11px; color:var(--muted); margin-top:6px;}
  .score-bar{display:flex; align-items:center; gap:8px; margin:5px 0; font-size:11.5px; color:var(--muted);}
  .score-bar span{width:88px; flex:none;}
  .score-bar i{flex:1; height:6px; background:var(--line); border-radius:3px; overflow:hidden; position:relative;}
  .score-bar i::after{content:''; position:absolute; left:0; top:0; bottom:0; width:var(--w); background:var(--jade); border-radius:3px;}
  .score-bar em{font-style:normal; width:30px; text-align:right; color:var(--ivory); font-variant-numeric:tabular-nums;}
  .warn-pill{background:rgba(180,150,90,0.14); color:#C7A15E; font-size:11px; padding:2px 8px; border-radius:20px; margin-left:4px; white-space:nowrap;}
  .score-warn{font-size:11.5px; color:var(--brick); margin-top:6px; line-height:1.6;}
  /* V1.1 置信度徽标：A jade / B 灰 / C amber，复用主题变量，行内小徽标不撑破布局 */
  .conf-badge{display:inline-block; font-size:10.5px; line-height:1.4; padding:1px 6px; border-radius:20px; font-weight:600; margin-left:5px; vertical-align:middle; white-space:nowrap;}
  .conf-badge.conf-A{background:var(--jade-dim); color:var(--jade);}
  .conf-badge.conf-B{background:var(--line); color:var(--muted);}
  .conf-badge.conf-C{background:var(--gold-dim); color:var(--gold);}
  .score-caliber{font-size:11.5px; color:var(--muted); margin-top:6px; line-height:1.6;}
  .mkt-strip.off{opacity:.45;}

  /* 板块轮动（sector_rotation_daily 批次）：双榜 + 主题条 + 标签色点 + 静态证据脚注 */
  .sector-card{background:var(--panel); border:1px solid var(--line); border-radius:10px; overflow:hidden;}
  .sector-summary{font-size:12px; color:var(--muted); padding:12px 16px; border-bottom:1px solid var(--line); line-height:1.8;}
  .sector-summary b{color:var(--ivory); font-weight:600;}
  .sector-stale{color:var(--gold); font-weight:600;}
  .sector-muted{color:var(--muted);}
  .sector-list-title{font-size:12px; color:var(--ivory); padding:12px 16px 6px; display:flex; align-items:baseline; gap:6px; flex-wrap:wrap;}
  .sector-list-sub{font-size:11px; color:var(--muted);}
  .sector-list-title.clickable{cursor:pointer;}
  .sector-list{border-top:1px solid var(--line);}
  .sector-row{padding:8px 16px 9px; border-bottom:1px solid var(--line); cursor:pointer;}
  .sector-row:nth-child(even){background:var(--panel-2);}
  .sector-line1{display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:13px;}
  .sector-ind{font-weight:600;}
  .sector-state{font-size:11px; padding:2px 8px; border-radius:20px; white-space:nowrap;}
  .st-up{background:var(--jade-dim); color:var(--jade);}
  .st-down{background:var(--brick-dim); color:var(--brick);}
  .st-mid{background:var(--panel-2); color:var(--ivory);}
  .sector-row:nth-child(even) .st-mid{background:var(--line);}
  .sector-line1 .chevron{margin-left:auto;}
  .sector-stale-tag{font-size:10.5px; color:var(--gold); border:1px solid var(--gold); border-radius:4px; padding:1px 5px; white-space:nowrap;}
  .sector-metrics{font-size:11px; color:var(--muted); margin-top:4px; line-height:1.7;}
  .sector-metrics em, .sector-theme-vals em{font-style:normal; color:var(--ivory); font-variant-numeric:tabular-nums;}
  .sector-acc{color:var(--gold);}
  /* 退化行（代表ETF 不足 61 根，m60/m20/乖离不可算）：置榜末 + 标灰，与真实信号区分 */
  .sector-row.deg{opacity:.66;}
  .sector-row.deg .sector-ind{font-weight:500;}
  .sector-row.deg .sector-state.st-deg{filter:grayscale(1); background:var(--line); color:var(--muted);}
  .sector-deg-tag{font-size:10.5px; color:var(--muted); border:1px dashed var(--line-strong); border-radius:4px; padding:1px 5px; white-space:nowrap;}
  .sector-labels{display:inline-flex; gap:10px; flex-wrap:wrap;}
  .sector-label{font-size:11px; color:var(--muted); white-space:nowrap;}
  .sector-dot{display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:4px; vertical-align:middle;}
  .dot-green{background:var(--jade);}
  .dot-red{background:var(--brick);}
  .dot-amber{background:var(--gold);}
  .dot-gray{background:var(--muted);}
  .sector-hint{font-size:11px; color:var(--muted); margin-top:3px; line-height:1.6;}
  .sector-etf-body{display:none; margin-top:8px; padding:10px 12px; background:var(--panel-2); border-radius:8px;}
  .sector-etf-body.open{display:block;}
  .sector-etf-row{display:flex; gap:8px; align-items:baseline; font-size:11.5px; padding:4px 0; border-bottom:1px solid var(--line); flex-wrap:wrap;}
  .sector-etf-row:last-child{border-bottom:none;}
  .sector-etf-row .nm{color:var(--ivory);}
  .sector-etf-rep{color:var(--gold); font-size:10.5px;}
  .sector-fold{background:transparent; border:1px solid var(--line-strong); color:var(--muted); font-size:11.5px; padding:2px 10px; border-radius:14px; cursor:pointer; font-family:var(--sans); white-space:nowrap;}
  .sector-fold:hover{color:var(--ivory);}
  .sector-title-right{display:flex; align-items:center; gap:8px;}
  .sector-more{display:block; width:calc(100% - 32px); margin:8px 16px 12px; padding:8px; border:1px dashed var(--line-strong); background:transparent; color:var(--muted); font-size:11.5px; border-radius:7px; cursor:pointer; font-family:var(--sans);}
  .sector-theme{display:flex; flex-wrap:wrap; gap:8px; padding:6px 16px 14px;}
  .sector-theme-item{flex:1 1 calc(50% - 8px); min-width:0; border:1px solid var(--line); border-radius:8px; padding:8px 10px; font-size:11.5px; display:flex; gap:6px; align-items:center; flex-wrap:wrap;}
  .sector-theme-item .t{font-weight:600; color:var(--ivory);}
  .sector-theme-item.na{opacity:.6;}
  .sector-theme-vals{flex:1 1 100%; font-size:11px; color:var(--muted); line-height:1.6;}
  .sector-foot{font-size:11px; color:var(--muted); line-height:1.9; padding:12px 16px 14px; border-top:1px solid var(--line); background:var(--ink);}

  .sync-strip{display:flex; align-items:center; gap:10px; margin-top:10px; font-size:12px; color:var(--muted);}
  .sync-spacer{flex:1;}
  .sync-btn{background:transparent; border:1px solid var(--line-strong); color:var(--ivory); font-size:12px; padding:4px 12px; border-radius:14px; cursor:pointer; font-family:var(--sans);}
  .sync-strip.err #syncText{color:var(--brick);}
  .sync-strip.off{opacity:.45;}

  /* 桌面端：内容限宽居中并放大字体（手机端不受影响） */
  @media (min-width: 768px){
    .masthead, .section{max-width:780px; margin:0 auto;}
    .masthead{padding:36px 24px 22px;}
    .masthead h1{font-size:28px;}
    .masthead .date{font-size:14px;}
    .goal-stat .num{font-size:34px;}
    .goal-stat .lbl{font-size:14px;}
    .section{padding:28px 24px;}
    .section-title{font-size:20px;}
    .section-title .hint{font-size:14px;}
    .theme-table{font-size:15px;}
    .theme-table th{font-size:13.5px;}
    .over-tag{font-size:13px;}
    .fund-head{padding:16px 20px;}
    .fund-name{font-size:18px;}
    .fund-meta{font-size:13.5px;}
    .fund-return{font-size:18px;}
    .signal-strip{padding:0 20px 16px 20px;}
    .signal-pill{font-size:14px;}
    .signal-amount{font-size:14px;}
    .signal-reason{font-size:14px; padding:0 20px 16px 20px;}
    .dual-strip{padding:0 20px 8px 20px;}
    .dual-tag{font-size:12.5px;}
    .dual-amt{font-size:13.5px;}
    .dual-strip .signal-pill{font-size:13px;}
    .fund-body{padding:20px;}
    .field label{font-size:13px;}
    .field input, .field select{font-size:15px; padding:10px 12px;}
    .checkline{font-size:15px;}
    .divider-label{font-size:13px;}
    .resume-box{font-size:14px;}
    .btn{font-size:15px;}
    .profit-alert{font-size:14px;}
    .add-fund-btn{font-size:15px;}
    .empty{font-size:15px;}
    .small-note{font-size:13px;}
    .mkt-strip{font-size:13.5px;}
    .mkt-strip .signal-pill{font-size:13px;}
    .mkt-label{font-size:13px;}
    .tabs-row{max-width:780px; margin:0 auto; padding-top:20px;}
    .tab-btn{font-size:15px;}
    .settings-row{font-size:13.5px;}
    .settings-row input{font-size:14px;}
    .stock-alert{font-size:13.5px;}
    .sync-strip{font-size:13.5px;}
    .sync-btn{font-size:13px;}
    .modal h2{font-size:20px;}
    .toast{font-size:14px;}
    .sector-summary{font-size:14px;}
    .sector-list-title{font-size:14px;}
    .sector-list-sub, .sector-metrics, .sector-label, .sector-hint, .sector-theme-vals{font-size:12.5px;}
    .sector-line1{font-size:15px;}
    .sector-state{font-size:12px;}
    .sector-theme-item, .sector-etf-row, .sector-more{font-size:13px;}
    .sector-fold{font-size:12.5px;}
    .sector-foot{font-size:12.5px;}
  }
  .research-pill{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;border:1px solid var(--line);cursor:pointer;}
  .rp-warm{background:rgba(16,150,93,.08);color:var(--jade);border-color:var(--jade);}
  .rp-flat{background:rgba(120,120,120,.08);color:var(--muted);}
  .rp-cool{background:rgba(200,130,0,.08);color:#a06000;border-color:#c88200;}
  .rp-bad{background:rgba(180,60,50,.08);color:var(--brick);border-color:var(--brick);}
  .rp-run,.rp-fail{color:var(--muted);}
  .rp-fail{color:var(--brick);border-color:var(--brick);}
  .rp-card{margin-top:10px;}
  .rp-head{font-weight:600;margin-bottom:6px;}
  .rp-summary{margin-bottom:8px;}
  .rp-sec{margin-top:10px;}
  .rp-sec-title{font-weight:600;font-size:12.5px;margin-bottom:2px;}

<script>
const STORE_KEY = 'dinvest_funds_v1';
const THEME_CAP_KEY = 'dinvest_theme_caps_v1';
const SYNC_TS_KEY = 'dinvest_sync_ts_v1';
const STOCKS_KEY = 'dinvest_stocks_v1';

const GOAL = 200000;

// Supabase 云同步配置（publishable key 设计为公开嵌入页面，安全靠登录+行级权限）
const SUPABASE_URL = 'https://sfauluwxmdginezbluvo.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_ogx_OZOqR0tEgr24Dt1DSg_VZasrzuM';
const TABLE_NAME = 'dingtou_state';

// 每只基金可选的大盘参考指数（secid 为东方财富行情代码；th=[深度低位,低位,高位,明显高位] 阈值，波动大的指数放宽）
const BENCHMARKS = {
  HS300:  {secid:'1.000300',   name:'沪深300',  th:[-8,-3,3,8]},
  NDX:    {secid:'100.NDX',    name:'纳斯达克',  th:[-8,-3,3,8]},
  SPX:    {secid:'100.SPX',    name:'标普500',  th:[-8,-3,3,8]},
  DJIA:   {secid:'100.DJIA',   name:'道琼斯',   th:[-8,-3,3,8]},
  HSI:    {secid:'100.HSI',    name:'恒生指数',  th:[-8,-3,3,8]},
  HSTECH: {secid:'124.HSTECH', name:'恒生科技',  th:[-12,-5,5,12]},
  N225:   {secid:'100.N225',   name:'日经225',   th:[-8,-3,3,8]}
};

const DEFAULT_THEMES = ['机器人/先进制造','电力/新能源','全球资源','日本股票','美国股票','均衡配置'];
const DEFAULT_CAPS = {'机器人/先进制造':10,'电力/新能源':15,'全球资源':20,'日本股票':15,'美国股票':30,'均衡配置':10};

const DEFAULT_TIERS = [
  {ret:20, sell:10},
  {ret:40, sell:20},
  {ret:60, sell:30},
  {ret:80, sell:50}
];

// 止盈策略预设：下拉选择后自动填入档位，可在文本框微调
const TIER_PRESETS = {
  invest:  { name:'投资式·长期少卖', tiers:'20:10,40:20,60:30,80:50' },
  recycle: { name:'回收式·持续降成本', tiers:'25:10,40:15,60:20,100:25' },
  swing:   { name:'波段式·快速锁盈', tiers:'10:30,20:30,35:20,50:20' }
};
function tierPresetFor(text){
  return Object.keys(TIER_PRESETS).find(k=>TIER_PRESETS[k].tiers===String(text||'').trim()) || '';
}

let funds = [];
let themeCaps = {...DEFAULT_CAPS};
let editingId = null;
// fund id → 「自动获取」按完整历史回算出的连续站上MA60天数，保存时同步后清除
const fetchedStreaks = {};

// 大盘参考：按各基金自选指数独立计算档位（key → 行情状态）；每只基金选「不参考」即豁免
let mktMap = {};
let mktFetching = {};

// 股票持仓与设置
let stocks = [];
let activeTab = 'funds'; // 当前页签：顶部统计按基金/股票分别口径展示
let goal = GOAL;      // 基金目标总额（可在页面调整，主题上限随之缩放）
let stockCap = 0;     // 股票总仓位上限（0=不限）

// 量化评分（stock_score 最新批次）：null=尚未生成/加载失败，UI 优雅降级
let scoreState = null; // { batch, rows: Map<code,row>, top10: row[] }
let scoreTried = false; // 已尝试拉取；纯本地未接云时不展示占位文案

// 板块轮动（sector_rotation_daily 最新批次）：与 scoreState 同范式——null=尚未生成/读取失败，卡片优雅降级
let sectorState = null; // { batch, rows, accCounts: Map<pk_etf,n>, poolPools: {l1,l2,batch} }

// 云同步状态
let sb = null;            // supabase client
let sbUser = null;        // 当前登录用户
let cloudReady = false;   // SDK 加载成功
let syncState = 'none';   // none | syncing | ok | error
let syncErrMsg = '';
let lastPullAt = 0;

// 数据存取：artifact 宿主的 window.storage 优先；本地浏览器直接打开时回退到 localStorage
const store = {
  async get(key){
    if(window.storage && typeof window.storage.get === 'function'){
      try{ return await window.storage.get(key); }catch(e){}
    }
    try{ const v = localStorage.getItem(key); return v===null ? null : {value:v}; }catch(e){ return null; }
  },
  async set(key, value){
    if(window.storage && typeof window.storage.set === 'function'){
      try{ return await window.storage.set(key, value); }catch(e){}
    }
    try{ localStorage.setItem(key, value); }catch(e){}
  }
};

function uid(){ return 'f' + Math.random().toString(36).slice(2,10); }

function migrateFunds(){
  funds.forEach(f=>{
    // 迁移：旧数据只有市值没有份额，按 市值÷当前净值 反推份额
    if((f.shares===undefined||f.shares==='') && f.marketValue>0 && f.currentNav>0){
      f.shares = Math.round(f.marketValue/f.currentNav*10000)/10000;
    }
    if(!f.profitTiers) f.profitTiers = DEFAULT_TIERS;
    if(!f.profitTaken) f.profitTaken = [];
    if(!f.resumeRule) f.resumeRule = {requireDays:3, mode:'ma_only', targetDrawdown:''};
    if(f.benchmark===undefined || f.benchmark===null) f.benchmark = 'HS300';
    if(f.name && detectFundTraits(f.name).isQDII) f.isQDII = true;
  });
}

// 一次性迁移：旧六板块占比重置为新配置（机器人10/电力15/全球资源20/日本15/美国30/均衡10）；本地与云端两条路径都过这里
function migrateThemeCaps(){
  if(themeCaps['美国股票']===undefined || themeCaps['机器人/先进制造']===15){
    themeCaps = {...DEFAULT_CAPS};
    saveCaps();
    return true;
  }
  return false;
}

async function loadAll(){
  try{
    const r = await store.get(STORE_KEY);
    funds = r ? JSON.parse(r.value) : [];
  }catch(e){ funds = []; }
  try{
    const r2 = await store.get(THEME_CAP_KEY);
    themeCaps = r2 ? JSON.parse(r2.value) : {...DEFAULT_CAPS};
  }catch(e){ themeCaps = {...DEFAULT_CAPS}; }
  try{
    const r4 = await store.get(STOCKS_KEY);
    stocks = r4 ? JSON.parse(r4.value) : [];
  }catch(e){ stocks = []; }
  // 清除历史污染：名称为纯数字的（曾被代码兜底），置空等待云端/手动修复
  stocks.forEach(s=>{ if(/^\d+$/.test(String(s.name||'').trim())) s.name=''; });
  try{
    const r5 = await store.get(SETTINGS_KEY);
    const s = r5 ? JSON.parse(r5.value) : {};
    if(s.goal) goal = s.goal;
    if(s.stockCap !== undefined) stockCap = s.stockCap || 0;
  }catch(e){}
  migrateFunds();
  migrateThemeCaps();
  render();
  ensureBenchmarkData();
  initCloud();
  // 未登录/云端不可用时，打开页面稍后直接本地自动刷新；已登录时由 syncOnOpen 完成后触发
  setTimeout(()=>{ if(!sbUser && !cloudReady) autoRefreshAll(); }, 2000);
  setTimeout(()=>{ if(!sbUser) autoRefreshAll(); }, 4000);
  try{ document.getElementById('goalInput').value = goal; }catch(e){}
  try{ document.getElementById('stockCapInput').value = stockCap || ''; }catch(e){}
  try{
    const t = localStorage.getItem('dinvest_tab');
    if(t==='stocks'){ const b = document.querySelector('.tab-btn[data-tab="stocks"]'); if(b) b.click(); }
  }catch(e){}
}

async function saveFunds(){
  try{ await store.set(STORE_KEY, JSON.stringify(funds)); }
  catch(e){ showToast('保存失败，请重试'); }
  pushCloud();
}
async function saveStocks(){
  try{ await store.set(STOCKS_KEY, JSON.stringify(stocks)); }
  catch(e){ showToast('保存失败，请重试'); }
  pushCloud();
}
async function saveSettings(){
  try{ await store.set(SETTINGS_KEY, JSON.stringify({goal, stockCap})); }
  catch(e){}
  pushCloud();
}
async function saveCaps(){
  try{ await store.set(THEME_CAP_KEY, JSON.stringify(themeCaps)); }
  catch(e){}
  pushCloud();
}

// ===================== 云同步（Supabase） =====================
// 数据按 auth.uid() 行级隔离；页面只需 publishable key（公开），安全靠登录+RLS。
function localSavedAt(){ try{ return localStorage.getItem(SYNC_TS_KEY); }catch(e){ return null; } }
async function markLocalSaved(){ try{ localStorage.setItem(SYNC_TS_KEY, new Date().toISOString()); }catch(e){} }
function cloudErrHint(e){
  const m = String(e && e.message || e || '');
  if(/does not exist|PGRST205|relation/.test(m)) return '数据表未创建';
  if(/Failed to fetch|fetch/i.test(m)) return '网络不通';
  return '配置或网络问题';
}

function initCloud(tries){
  // SDK 为 async 加载：网络慢时轮询等待，不阻塞页面渲染；超时则云同步降级为不可用
  const hasSdk = !!(window.supabase && window.supabase.createClient);
  if(!hasSdk){
    if((tries||0) < 20){ setTimeout(()=>initCloud((tries||0)+1), 500); return; }
    setSyncUI();
    return;
  }
  try{
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
    cloudReady = true;
  }catch(e){ setSyncUI(); return; }
  sb.auth.getSession().then(({data})=>{
    sbUser = (data && data.session && data.session.user) || null;
    setSyncUI();
    if(sbUser) syncOnOpen();
    else autoRefreshAll(); // 未登录：本地数据不会被子覆盖，直接刷新
  }).catch(()=>{ setSyncUI(); autoRefreshAll(); });
  sb.auth.onAuthStateChange((_event, session)=>{
    const wasLoggedOut = !sbUser;
    sbUser = (session && session.user) || null;
    setSyncUI();
    if(sbUser && wasLoggedOut){
      closeLoginModal();
      syncOnOpen();
    }
  });
  // 切回页面时顺手拉一次（限频60秒），捕捉其他设备的改动
  window.addEventListener('focus', ()=>{
    if(sbUser && Date.now()-lastPullAt > 60000) syncOnOpen();
  });
  // 评分表 anon 可读、全局共享，客户端就绪即拉一次；失败仅降级不阻塞页面
  loadStockScores().then(()=>render());
  loadFundamentals().then(()=>renderStockSection());
  setSyncUI();
}

// ===================== 量化评分（stock_score 只读） =====================
async function loadStockScores(){
  if(!cloudReady || !sb) return;
  scoreTried = true;
  try{
    const { data: b, error: be } = await sb.from('stock_score').select('batch_date')
      .order('batch_date',{ascending:false}).limit(1).maybeSingle();
    if(be || !b) return;
    const batch = b.batch_date;
    // 精选池行（in_pool）+ 我的持仓行（code.in）一次取回
    const codes = [...new Set(stocks.map(s=>String(s.code||'').trim()).filter(c=>/^\d{5,6}$/.test(c)))];
    const orFilter = codes.length ? 'in_pool.eq.true,code.in.(' + codes.join(',') + ')' : 'in_pool.eq.true';
    const { data, error } = await sb.from('stock_score').select('*')
      .eq('batch_date', batch).or(orFilter).order('final',{ascending:false});
    if(error || !data) return;
    const rows = data.filter(r=>r && r.final!==null && r.final!==undefined);
    scoreState = { batch, rows: new Map(rows.map(r=>[String(r.code),r])), top10: rows.filter(r=>r.in_pool).slice(0,10) };
  }catch(e){ console.warn('scores load failed', e); }
}

function scoreStars(f){ return f>=90?'★★★★★':f>=80?'★★★★☆':f>=70?'★★★★':f>=60?'★★★':f>=50?'★★':'★'; }

function renderScoreTop10(){
  if(!scoreState)
    return scoreTried ? `<div class="signal-strip"><span class="signal-pill pill-normal">评分批次尚未生成（夜间批处理上线后自动出现）</span></div>` : '';
  const { batch, top10 } = scoreState;
  return `<div class="fund-card">
    <div class="score-card-title">精选池 Top10 · 量化初筛 <span style="font-weight:400;font-size:11.5px;color:var(--muted)">批次 ${escapeHtml(String(batch))}</span></div>
    ${top10.length ? top10.map((r,i)=>{
      const mkt = (r.market_rank!=null && r.market_n) ? ' · 市场前' + Math.max(1, Math.round(100 - r.market_rank/r.market_n*100)) + '%' : '';
      const ind = (r.ind_rank!=null && r.ind_n) ? ' 行业' + r.ind_rank + '/' + r.ind_n : '';
      const fl = ((r.flags)||[]).length ? ' ⚠' + r.flags.join('、') : '';
      const conf = (r.confidence==='A'||r.confidence==='B'||r.confidence==='C') ? `<span class="conf-badge conf-${r.confidence}">${r.confidence}</span>` : '';
      return `<div class="score-row" data-code="${escapeHtml(String(r.code))}"><span style="color:var(--muted);width:24px">#${i+1}</span><b>${escapeHtml(r.name||'')}</b>${conf}<span style="color:var(--muted);font-size:11.5px">${escapeHtml(String(r.code))}</span><span class="score-pill">${r.final.toFixed(1)}分 ${scoreStars(r.final)}</span><span style="color:var(--muted);font-size:11px">${escapeHtml(r.ths_l1||'')}${ind}${mkt}${escapeHtml(fl)}</span></div>`;
    }).join('') : '<div class="score-row" style="color:var(--muted)">本批次精选池无评分行</div>'}
    <div class="score-card-note">评分为横截面相对位置（质量30/成长30/估值20/动量20，行业内百分位），不构成买卖建议；点开持仓卡片可见你的股票同口径明细。</div>
  </div>`;
}

function scorePillHtml(s){
  const sc = scoreState && s ? scoreState.rows.get(String(s.code||'').trim()) : null;
  if(!sc || sc.final===null || sc.final===undefined) return '';
  const warn = ((sc.flags)||[]).length || ((sc.warnings)||[]).length;
  const ind = (sc.ind_rank!=null && sc.ind_n) ? ' 行业' + sc.ind_rank + '/' + sc.ind_n : '';
  return `<span class="score-pill${warn?' score-pill-warn':''}">评分 ${Number(sc.final).toFixed(1)} · ${escapeHtml(sc.name||sc.ths_l1||'')}${escapeHtml(ind)}${warn?' ⚠':''}</span>`;
}

function scoreDetailHtml(s){
  const sc = scoreState && s ? scoreState.rows.get(String(s.code||'').trim()) : null;
  if(!sc) return '';
  const bar = (v,l)=>`<div class="score-bar"><span>${l}</span><i style="--w:${Math.max(0,Math.min(100, v==null?0:Number(v)))}%"></i><em>${v==null?'NA':Number(v).toFixed(0)}</em></div>`;
  const w = (sc.warnings||[]).map(x=>`<div class="score-warn">⚠ ${escapeHtml(String(x))}</div>`).join('');
  const f = (sc.flags||[]).map(x=>`<span class="warn-pill">${escapeHtml(String(x))}</span>`).join('');
  const num = v => (v==null ? 'NA' : v);
  // V1.1：口径与置信度行 + 正常化 PE 揭示（全部字段安全降级，旧批次行渲染如常）
  const ex = sc.extras || null;
  const mixed = (sc.flags||[]).includes('mixed_business');
  const segs = (ex && ex.mix && Array.isArray(ex.mix.segments)) ? ex.mix.segments.filter(x=>x&&typeof x.name==='string') : null;
  const mixSuffix = (segs && segs.length) ? ' · 收入结构 ' + segs.slice(0,2).map(x=>`${escapeHtml(x.name)}${Math.round((typeof x.ratio==='number'&&isFinite(x.ratio)?x.ratio:0)*100)}%`).join('/') : '';
  const indCaliber = '行业池 ' + escapeHtml(String(sc.ths_l2 || sc.ths_l1 || '—'));
  // I-1：优先按引擎落库的真实分组 grp 判定池口径（MARKET 含 mixed 与行业样本<20 两类，均对全市场取百分位）
  const grp = (ex && ex.pool && ex.pool.grp) || null;
  let caliber;
  if(grp){
    caliber = (grp === 'MARKET') ? ('全市场口径' + (mixed ? mixSuffix : '')) : indCaliber;
  } else {
    // 安全降级：旧批次无 extras.pool → 沿用原 mixed-flag-only 行为，绝不 undefined
    caliber = mixed ? ('全市场口径' + mixSuffix) : indCaliber;
  }
  const confTxt = (sc.confidence==='A'||sc.confidence==='B'||sc.confidence==='C') ? ' · 置信度 ' + sc.confidence : '';
  const normalPe = (ex && ex.implied_normal_pe_approx!=null && Number.isFinite(Number(ex.implied_normal_pe_approx))) ? `<div class="score-caliber">按当前利润增速正常化 PE ≈ ${Number(ex.implied_normal_pe_approx).toFixed(1)}（info-only）</div>` : '';
  return `<div class="score-detail">
    ${bar(sc.quality,'质量 Q(30%)')}${bar(sc.growth,'成长 G(30%)')}${bar(sc.value,'估值 V(20%)')}${bar(sc.momentum,'动量 M(20%)')}
    <div class="score-summary">综合 ${Number(sc.final).toFixed(1)} · 全市场 ${num(sc.market_rank)}/${num(sc.market_n)} · 数据完整度 ${sc.cov==null?'NA':Math.round(sc.cov)+'%'} · PE ${num(sc.pe)}${f}</div>
    <div class="score-caliber">口径：${caliber}${confTxt}</div>
    ${normalPe}
    ${w}<div class="score-src">财务截至 ${escapeHtml(String((sc.extras&&sc.extras.fin_period)||'—'))} · 批次 ${escapeHtml(String(scoreState.batch))} · 评分≠买入建议</div>
  </div>`;
}

function researchCredSet(cred){

function researchPillHtml(row){

// ---- 产业研究员：模块级数据/调用层（依赖页面运行时 sb/cloudReady，不在纯块内）----
let fundamentals = new Map(); // code -> stock_fundamental 行
let researchInflight = false; // 生成中互斥（Edge 同步等待最长 ~150-300s）
let researchPollTimer = null;

async function loadFundamentals(){
  if(!cloudReady || !sb) return;
  try{
    const { data, error } = await sb.from('stock_fundamental').select('*');
    if(error || !data) return;
    fundamentals = new Map(data.map(r=>[String(r.code), r]));
  }catch(e){}
}

async function invokeResearch(opts){
  // verify_jwt:true + 函数体 role 自校（仅 authenticated）：显式附当前会话 access_token 作 Bearer（邮箱/密码登录签发，role=authenticated，过网关+角色门）
  let headers = {};
  try{ const { data } = await sb.auth.getSession(); const tk = data && data.session && data.session.access_token; if(tk) headers.Authorization = 'Bearer ' + tk; }catch(e){}
  const { error: e, data } = await sb.functions.invoke('stock-research', { body: opts, headers });
  if(e) throw e;
  return data; // {ok,row,cached?}
}

function startStatusPoll(code){
  stopStatusPoll();
  const started = Date.now();
  researchPollTimer = setInterval(async ()=>{
    if(Date.now() - started > 10 * 60_000){ // 终审 Minor：>10min 仍 running → 自动止损（与后端 RUNNING_STALE_MS 对齐），不无限轮询
      stopStatusPoll();
      try{ const m = document.getElementById('researchMsg'); if(m){ m.textContent = '研究超时（>10 分钟未完成），后台可能已被中断，请稍后重试'; m.style.color = 'var(--brick)'; } }catch(e){}
      fundamentals.set(String(code), { code, status:'failed', verdict:null, error:'研究超时（>10 分钟）', finished_at: new Date().toISOString() }); // 复审 Minor-C：止损同步回写 Map，使胶囊态收敛不致永远「研究中…」
      renderStockSection();
      return;
    }
    try{
      const d = await invokeResearch({action:'status', code});
      if(d && d.ok && d.row && d.row.status!=='running'){
        stopStatusPoll();
        fundamentals.set(String(d.row.code), d.row);
        renderStockSection();
        updateResearchResultCard(d.row);
      }
    }catch(e){}
  }, 10_000); // spec §8：running 每 10s 轮询
}
function stopStatusPoll(){ if(researchPollTimer){ clearInterval(researchPollTimer); researchPollTimer=null; } }

function researchResultCardHtml(row, cached){
  if(row.status==='running') return '<div class="fund-card rp-card"><div class="rp-head">🔍 产业研究员 · ' + escapeHtml(String(row.code)) + '</div><div class="rp-summary">研究中…（联网搜索+成文，约 1-3 分钟；本页保持打开）</div></div>';

  return '<div class="fund-card rp-card">' + researchReportHtml(row)
    + (cached ? '<div class="small-note">1 小时缓存命中，未产生新调用</div>' : '')
    + '<div class="btn-row"><button class="btn ghost" id="rpRetryBtn" ' + (researchRetryDisabled(row, Date.now())?'disabled':'') + '>重新研究' + (researchRetryDisabled(row, Date.now())?'（1 小时后可用）':'') + '</button></div></div>';
}
function renderResearchResultCard(row, cached){
  document.getElementById('researchResultSlot').innerHTML = researchResultCardHtml(row, cached);

  if(b && !b.disabled) b.addEventListener('click', ()=> document.getElementById('researchGoBtn').click());
}

// 以下均为无 IO 的纯函数/常量，是本卡片榜单/概要/退化判定/格式化的**唯一实现体**：
// 页面直接调用，scripts/sector_render_logic.ts 按本标记抽取并做类型化导出，
// scripts/sector_render_logic_test.ts 据其单测（单文件应用无构建步骤 ⇒ 实现体不外置）。
// 规则权威 spec §4.3/§5（含 L94「历史不足处理」）/§7；控制者裁决 R-T4-1（累积中判定）/R-T4-3（数值单位）/R-T4-4（主题最差状态）。
// 修复轮1：撤销上一轮沿用的 C3（把累积中行整体排除在双榜外，属派工越界）——按 spec L94 让
// 历史不足 250 根的行业并入其 state 所属榜单；只有 n<61（m60 根本算不出、引擎以 0 兜底）的退化行
// 显示「—」并置该榜末尾、标灰（消除 Task2 评审 M5「0 冒充平盘」隐患）。
const SECTOR_WORST_RANK = { '空头排列':0, '走弱':1, '纠缠':2, '多头':3, '强多头':4 };
const SECTOR_UP_STATES = ['强多头','多头'];
const SECTOR_DOWN_STATES = ['走弱','空头排列'];
const SECTOR_ENTANGLED_STATE = '纠缠'; // spec §4.3：纠缠只计数、不进双榜（组内仍列出行）
// brief Step2 色点映射：筑底候选=绿  过热警示/高位放量滞涨=红  禁追高=橙  退潮观察/左侧埋伏=灰
const SECTOR_LABEL_DOT = { '筑底候选':'green', '过热警示':'red', '高位放量滞涨':'red', '禁追高':'amber', '退潮观察':'gray', '左侧埋伏':'gray' };
// 可算性门槛（与 supabase/functions/sector-trend/engine.ts 同源，前端只读不重算）：
// pctChange(closes,60) 需 n>60 ⇒ m60 至少 61 根；sma(closes,120) 满窗需 120 根（engine 用 from=max(0,n-w) 兜底）。
const SECTOR_M60_MIN_BARS = 61;
const SECTOR_MA_FULL_BARS = 120;
// R-T4-4：卡片四个可覆盖主题沿用 DB theme 列原名（板块侧口径）；与 L352 DEFAULT_THEMES 的配置主题名
// 属两套分立系统（spec S1），不改名对齐。“均衡配置”为宽基配置类、无行业映射，本卡片不呈现（脚注已说明）。
const SECTOR_THEME_ORDER = ['电力/绿电','机器人','新能源车','全球资源'];
const SECTOR_NOT_COVERED_THEMES = ['美国股票','日本股票']; // spec §4.4/§7.3：A股行业ETF不覆盖

function sectorStateWorstRank(state){
  const r = SECTOR_WORST_RANK[state];
  return r === undefined ? SECTOR_WORST_RANK['纠缠'] : r; // 未知态回落中性，不得“胜出”为最差
}
// R-T4-1：表无 bars_n 列 ⇒ 累积中判定严格用 pos52 === null；pos52=0 是有效值（恰在52周最低点），严禁 falsy 判断
function sectorIsAccumulating(row){
  return !row || row.pos52 === null || row.pos52 === undefined;
}
// n = 该代表ETF 在 sector_kline 的根数，唯一来源是 loadSectorRotation 的 head count（不新造数据源）
function sectorBarsLookup(pk, accCounts){
  if(!accCounts || pk === null || pk === undefined) return null;
  const k = String(pk);
  if(typeof accCounts.get === 'function') return accCounts.get(k); // Map<pk_etf, n>
  return Object.prototype.hasOwnProperty.call(accCounts, k) ? accCounts[k] : null; // 纯对象（测试/兜底）
}
function sectorBarsN(row, accCounts){
  const n = row ? sectorBarsLookup(row.pk_etf, accCounts) : null;
  return (typeof n === 'number' && isFinite(n)) ? n : null;
}
// 退化行：累积中 &&（n<61 或 n 未知）。pos52 非空即代表 ETF 已有 ≥250 根，指标必可算，不入此列。
// n 未知（head count 请求失败）保守按退化处理 ⇒ 宁可少显示一个真实值，也不让兜底 0 冒充平盘（Task2 评审 M5）。
function sectorIsDegenerate(row, accCounts){
  if(!sectorIsAccumulating(row)) return false;
  const n = sectorBarsN(row, accCounts);
  return n === null || n < SECTOR_M60_MIN_BARS;
}
// 参与 m60 排序的唯一口径：退化行返回 null（engine 兜底 0 不得当真涨跌）；其余返回真实值
function sectorRowM60(row, accCounts){
  const v = sectorNum(row && row.m60);
  if(v === null) return null;
  return sectorIsDegenerate(row, accCounts) ? null : v;
}
function sectorSplitRows(rows){
  const tradable = [], accumulating = [];
  (rows||[]).forEach(r=>{ (sectorIsAccumulating(r) ? accumulating : tradable).push(r); });
  return { tradable, accumulating };
}
function sectorSplitDegenerate(rows, accCounts){
  const ranked = [], degenerate = [];
  (rows||[]).forEach(r=>{ (sectorIsDegenerate(r, accCounts) ? degenerate : ranked).push(r); });
  return { ranked, degenerate };
}
function sectorByState(rows, states){
  return (rows||[]).filter(r=>r && states.indexOf(r.state) >= 0);
}
function sectorCountByState(rows, states){
  return sectorByState(rows, states).length;
}
// spec L94：累积中行与其余行一样入榜；退化行不参与 m60 排序，置于本榜末尾
function sectorOrderedByM60(rows, accCounts, desc){
  const s = sectorSplitDegenerate(rows, accCounts);
  s.ranked.sort(desc ? (a,b)=>Number(b.m60)-Number(a.m60) : (a,b)=>Number(a.m60)-Number(b.m60));
  return s.ranked.concat(s.degenerate);
}
function sectorRankLists(rows, accCounts){
  const list = rows || [];
  const ent = sectorByState(list, [SECTOR_ENTANGLED_STATE]);
  const es = sectorSplitDegenerate(ent, accCounts);
  return {
    up: sectorOrderedByM60(sectorByState(list, SECTOR_UP_STATES), accCounts, true),
    down: sectorOrderedByM60(sectorByState(list, SECTOR_DOWN_STATES), accCounts, false),
    entangled: es.ranked.concat(es.degenerate),
    accumulating: list.filter(sectorIsAccumulating),
    degenerate: list.filter(r=>sectorIsDegenerate(r, accCounts))
  };
}
// 概要单一口径（修复轮1）：向上/纠缠/调整 = 全部入库行按 state 实数统计（含累积中行），
// 三数之和恒等于 total；accumulating/degenerate 是并列注记，不参与相加。与 rankLists 同源。
function sectorSummaryCounts(rows, accCounts){
  const list = rows || [];
  const rankable = list.filter(r=>!sectorIsDegenerate(r, accCounts));
  const ent = arr => sectorCountByState(arr, [SECTOR_ENTANGLED_STATE]);
  return {
    up: sectorCountByState(list, SECTOR_UP_STATES),
    entangled: ent(list),
    down: sectorCountByState(list, SECTOR_DOWN_STATES),
    accumulating: list.filter(sectorIsAccumulating).length,
    degenerate: list.length - rankable.length,
    total: list.length,
    rankable: { up: sectorCountByState(rankable, SECTOR_UP_STATES), entangled: ent(rankable), down: sectorCountByState(rankable, SECTOR_DOWN_STATES) }
  };
}
// 单元格取值口径：累积中 ⇒ pos52/dm20 留空（spec L94「pos52/dm20 相关标签留空」）；
// 退化 ⇒ dev60/m20/m60 一并留空（其基准 ma60 本身是部分窗口，显示即为伪精度）。
function sectorDisplayMetrics(row, accCounts){
  const acc = sectorIsAccumulating(row);
  const deg = sectorIsDegenerate(row, accCounts);
  const g = k => sectorNum(row && row[k]);
  const priceOk = !deg;
  return {
    barsN: acc ? sectorBarsN(row, accCounts) : null,
    accumulating: acc,
    degenerate: deg,
    dev60: priceOk ? g('dev60') : null,
    m20: priceOk ? g('m20') : null,
    m60: priceOk ? g('m60') : null,
    pos52: acc ? null : g('pos52'),
    dm20: acc ? null : g('dm20'),
    vr: g('vr'),
    score: g('score')
  };
}
// 每主题取其映射行业的最差状态；同最差状态取 m60 更低者
function sectorWorstRow(rows){
  if(!rows || !rows.length) return null;
  let best = null;
  rows.forEach(r=>{
    if(!best){ best = r; return; }
    const d = sectorStateWorstRank(r.state) - sectorStateWorstRank(best.state);
    if(d < 0 || (d === 0 && ((r.m60||0) < (best.m60||0)))) best = r;
  });
  return best;
}
function sectorThemeGroups(rows){
  const g = new Map();
  (rows||[]).forEach(r=>{
    if(!r || r.theme === null || r.theme === undefined || r.theme === '') return;
    if(!g.has(r.theme)) g.set(r.theme, []);
    g.get(r.theme).push(r);
  });
  return g;
}
function sectorThemeSummaries(rows, order){
  const g = sectorThemeGroups(rows);
  return (order||[]).map(theme=>{
    const rs = g.get(theme) || [];
    const labels = [];
    rs.forEach(r=>{ (Array.isArray(r.labels)?r.labels:[]).forEach(l=>{ if(l && labels.indexOf(l)<0) labels.push(l); }); });
    return { theme, rows: rs, worst: sectorWorstRow(rs), labels };
  });
}
// R-T4-3 单位口径：m20/m60/dev60 = 比率（×100 后显百分比）；pos52/mp/dm20 = 0-100 点位（不再 ×100）；
// vr = 倍数；score/v/m/l/q = 0-100 分。null/非有限一待显示为「—」（dm20 首跑全 null 属预期）。
function sectorNum(v){ return (v === null || v === undefined || !isFinite(Number(v))) ? null : Number(v); }
function fmtRatioPct(v, digits){
  const n = sectorNum(v); if(n === null) return '—';
  const p = n*100;
  return (p > 0 ? '+' : '') + p.toFixed(digits === undefined ? 2 : digits) + '%';
}
function fmtPoints(v, digits){
  const n = sectorNum(v); if(n === null) return '—';
  return n.toFixed(digits === undefined ? 1 : digits);
}
function fmtScoreVal(v){
  const n = sectorNum(v); if(n === null) return '—';
  return n.toFixed(1);
}
function fmtVr(v){
  const n = sectorNum(v); if(n === null) return '—';
  return n.toFixed(2);
}
function sectorLabelDots(labels){
  if(!Array.isArray(labels) || !labels.length) return '';
  return labels.filter(l=>l!==null && l!==undefined && String(l).length !== 0)
    .map(l=>`<span class="sector-label"><i class="sector-dot dot-${SECTOR_LABEL_DOT[String(l)]||'gray'}"></i>${escapeHtml(String(l))}</span>`).join('');
}
// R-T4-5：同花顺池名与规范行业名“互为子串”才提示；单字池名不参与（避免噪声）；只提示、不合成任何分数（spec §7.4）
function matchApproxPools(ind, pools){
  const name = String(ind||'').trim();
  if(!name || !Array.isArray(pools)) return [];
  const hit = [];
  pools.forEach(p=>{
    const s = String(p||'').trim();
    if(s.length < 2) return;
    if((s.indexOf(name) >= 0 || name.indexOf(s) >= 0) && hit.indexOf(s) < 0) hit.push(s);
  });
  return hit.sort();
}
// 修复轮2（评审 I1）：累积中行的 sector_kline head count 由串行 for…of+await 改为 Promise.all 并发扇出，
// 慢链路下≈N 个顺序 RT 压成≈1 个。**每行独立 try/catch**（控制要求2）：单行失败只置该行 n=null（沿用已裁决的
// 「head-count 失败保守按退化」语义，见 sectorIsDegenerate），绝不让整批 Promise.all 拒绝。IO 由调用方注入 fetchCount，
// 本函数无全局依赖 ⇒ 属纯逻辑、由 scripts/sector_render_logic.ts 门面抽取单测（唯一实现体，无副本）。
function sectorBuildAccCounts(rows, fetchCount){
  const acc = (Array.isArray(rows) ? rows : []).filter(sectorIsAccumulating);
  return Promise.all(acc.map(async (r)=>{
    let n = null;
    try{ n = await fetchCount(r.pk_etf); }catch(e){ n = null; }
    return [String(r.pk_etf), (typeof n === 'number' && isFinite(n)) ? n : null];
  })).then(pairs=>new Map(pairs));
}
// 修复轮2（评审 I1）竞态守卫的谓词：卡片移出 autoRefresh 关键路径（fire-and-forget）后，focus 重入/切页签可让
// 多个 loadSectorRotation 同时在飞；请求开始时 begin() 取自增序号，写 sectorState/渲染前先 isStaleReq(本次, 最新) ——
// 只要本请求序号不是最新（迟到的旧响应）就判弃，后到者不得覆盖新批次渲染。序号错乱也按陈旧处理（宁严勿宽）。
function sectorIsStaleReq(reqSeq, latestSeq){
  return reqSeq !== latestSeq;
}
// 修复轮2（评审 I1）：自增请求序号发生器（闭包持有 seq）。begin() 抢占并返回本次序号；isCurrent(id) 判定 id 是否仍为最新。
function sectorCreateReqGuard(){
  let seq = 0;
  return {
    begin(){ seq += 1; return seq; },
    isCurrent(id){ return id === seq; }
  };
}
// 收尾新增：整卡折叠的唯一真相源 —— 按钮文案与卡片体是否渲染两个消费方都取此处，
// 避免「按钮说展开、卡片已折」这类双份状态打架。折叠粒度=整卡，概要行常显。
// 取 `=== true` 严格判据：undefined / null / 'yes' 等非 true 值一律归为展开，保证「默认展开」不依赖调用方传对值。
function sectorFoldState(collapsed){
  return collapsed === true
    ? { label: '展开 ▾', bodyShown: false }
    : { label: '收起 ▴', bodyShown: true };
}
// ==== SECTOR_PURE_END ====

const SECTOR_DOWN_PREVIEW = 20; // 调整榜默认预览条数（本批次 74 条，移动端不至于冗长）
let sectorLastRows = [];       // 上一次渲染的行（展开/收起重绘使用，也供控制台合成行验证 stale 分支）
// 折叠态跨刷新记忆：与 dinvest_tab 同一范式（读写各自 try/catch 包住）——
// 无痕模式/存储被禁时静默降级为默认展开，不能因此白屏。localStorage 按访问地址隔离。
const SECTOR_COLLAPSED_KEY = 'dinvest_sector_collapsed';
function sectorReadCollapsedPref(){
  try{ return localStorage.getItem(SECTOR_COLLAPSED_KEY) === '1'; }catch(e){ return false; }
}
function sectorWriteCollapsedPref(v){
  try{ localStorage.setItem(SECTOR_COLLAPSED_KEY, v ? '1' : '0'); }catch(e){}
}
// collapsed 默认 false = 默认展开（无存储或读失败时 sectorReadCollapsedPref 返回 false）
let sectorUi = { showAllDown:false, showEntangled:false, collapsed:sectorReadCollapsedPref() }; // 修复轮1：累积中行已并入各榜，不再单独成组
const sectorReqGuard = sectorCreateReqGuard(); // 修复轮2（评审 I1）：loadSectorRotation 请求序号守卫（允许同时在飞多个请求，只有最新者可写状态/渲染）

async function loadSectorRotation(){
  if(!cloudReady || !sb) return;
  const reqId = sectorReqGuard.begin(); // 修复轮2（评审 I1）：抢占本次请求序号；每个写入点前检查 isCurrent，迟到的旧响应（focus 重入/切页签触发的新批次在后）不得覆盖新渲染
  const stale = ()=>sectorReqGuard.isCurrent(reqId) === false;
  try{
    // 与 loadStockScores 同一范式：先定位最新 batch_date，再整批取回（brief Step1 的 limit(160)+过滤等效）
    const { data: b, error: be } = await sb.from('sector_rotation_daily').select('batch_date')
      .order('batch_date',{ascending:false}).limit(1).maybeSingle();
    if(stale()) return;
    if(be){ renderSectorPlaceholder('板块轮动批次读取失败（网络或云端异常），下次刷新自动重试'); return; }
    if(!b){ renderSectorPlaceholder(); return; } // 表为空 = 真无批次
    const batch = b.batch_date;
    const { data, error } = await sb.from('sector_rotation_daily').select('*')
      .eq('batch_date', batch).order('m60',{ascending:false}).limit(400);
    if(stale()) return;
    if(error){ renderSectorPlaceholder('板块轮动批次读取失败（网络或云端异常），下次刷新自动重试'); return; }
    if(!data || !data.length){ renderSectorPlaceholder(); return; }
    const rows = data.filter(r=>r && r.batch_date === batch);
    if(!rows.length){ renderSectorPlaceholder(); return; }
    // R-T4-1 + 修复轮2（评审 I1 ①）：「数据积累中(n=X)」的 n 仍只对累积中行（≤6 行）发 sector_kline head count，
    // 不全量拉 K 线；串行 for…of+await 改为 Promise.all 并发，每行独立 try/catch → 单行失败仅该行 n=null（保守按退化）
    const accCounts = await sectorBuildAccCounts(rows, async (pk)=>{
      const { count } = await sb.from('sector_kline').select('*', {count:'exact', head:true}).eq('etf_code', pk);
      return count;
    });
    const poolPools = await loadThsPoolNames();
    if(stale()) return; // 所有 await 完成后、写入前最后一道守卫：旧请求丢弃，不覆盖新批次
    sectorState = { batch, rows, accCounts, poolPools };
    renderSectorCard(rows);
  }catch(e){
    if(stale()) return; // 迟到的旧失败不得用降级占位覆盖新渲染
    console.warn('sector rotation load failed', e); // 仅降级，不阻塞页面其他功能
    renderSectorPlaceholder('板块轮动批次读取失败（网络或云端异常），下次刷新自动重试');
  }
}

// R-T4-5：只取 stock_score 最新批次精选池（in_pool，上限 1000 行）的 distinct ths_l1/ths_l2；失败降级为无提示
async function loadThsPoolNames(){
  const empty = { l1: [], l2: [], batch: null };
  try{
    const { data: b } = await sb.from('stock_score').select('batch_date')
      .order('batch_date',{ascending:false}).limit(1).maybeSingle();
    if(!b) return empty;
    const { data, error } = await sb.from('stock_score').select('ths_l1,ths_l2')
      .eq('batch_date', b.batch_date).eq('in_pool', true).limit(1000);
    if(error || !data) return empty;
    const pick = k => [...new Set(data.map(r=>String(r[k]||'').trim()).filter(s=>s.length))];
    return { l1: pick('ths_l1'), l2: pick('ths_l2'), batch: b.batch_date };
  }catch(e){ return empty; }
}

function renderSectorPlaceholder(msg){
  const root = document.getElementById('sectorCardRoot');
  if(!root) return;
  // 无批次/读取失败时隐藏折叠按钮 —— 没什么可折，不能出现一个点开是空的「展开」
  const fb = document.getElementById('sectorFoldBtn');
  if(fb) fb.style.display = 'none';
  // cron 已错峰到 22:35（brief 写 22:30，与生产 reschedule 后的实际排程不一致，取生产值）
  root.innerHTML = `<div class="sector-card"><div class="sector-summary">${escapeHtml(msg || '尚无批次，等待今晚 22:35 跑批')}</div></div>`;
}

function sectorStateClass(state){
  return SECTOR_UP_STATES.indexOf(state)>=0 ? 'st-up' : (SECTOR_DOWN_STATES.indexOf(state)>=0 ? 'st-down' : 'st-mid');
}

function sectorPoolHint(ind, pools){
  const l1 = matchApproxPools(ind, (pools && pools.l1) || []);
  const l2 = matchApproxPools(ind, (pools && pools.l2) || []);
  if(!l1.length && !l2.length) return '';
  const parts = l1.map(x=>'L1:'+x).concat(l2.map(x=>'L2:'+x)).slice(0,4);
  return '个股侧近似池: ' + escapeHtml(parts.join('、')) + '（分类口径不同，仅供参考）';
}

function sectorRowHtml(r, accCounts, pools){
  const m = sectorDisplayMetrics(r, accCounts);
  const factors = '行业四因子（规模加权）：估值 ' + fmtScoreVal(r.v) + ' · 动量 ' + fmtScoreVal(r.m)
    + ' · 规模 ' + fmtScoreVal(r.l) + ' · 景气 ' + fmtScoreVal(r.q) + '（Q 无数据时 V/M/L renorm 46/38/15）';
  let tip = factors;
  if(m.accumulating){
    tip += '\n代表ETF 历史 ' + (m.barsN === null ? '未知' : m.barsN + ' 根') + '（<250）⇒ 52周分位与 ΔM20 留空，pos52/dm20 相关标签留空（spec §5 历史不足处理）。';
  }
  if(m.degenerate){
    tip += '\n历史不足 ' + SECTOR_M60_MIN_BARS + ' 根 ⇒ 20/60日涨跌与乖离MA60 不可算（引擎以 0 兜底，前端不呈现伪平盘），本行不参与 60 日排序、置榜末；'
      + '且 n<' + SECTOR_MA_FULL_BARS + ' 时 ma120 为部分窗口，均线五态不可靠。';
  }
  const metrics = `乖离MA60 <em>${fmtRatioPct(m.dev60)}</em> · 20日 <em>${fmtRatioPct(m.m20)}</em> · 60日 <em>${fmtRatioPct(m.m60)}</em>`
    + ` · 52周分位 <em>${fmtPoints(m.pos52)}</em> · ΔM20 <em>${fmtPoints(m.dm20)}</em> · 量比 <em>${fmtVr(m.vr)}</em> · 行业分 <em>${fmtScoreVal(m.score)}</em>`
    + (m.accumulating ? ` · <span class="sector-acc">数据积累中(n=${m.barsN === null ? '—' : escapeHtml(String(m.barsN))})</span>` : '')
    + (m.degenerate ? ' <span class="sector-deg-tag">均线不足，状态不可靠</span>' : '');
  const hint = sectorPoolHint(r.ind, pools);
  return `<div class="sector-row${m.degenerate?' deg':''}" data-ind="${escapeHtml(String(r.ind))}">
    <div class="sector-line1">
      <span class="sector-ind">${escapeHtml(String(r.ind))}</span>
      <span class="sector-state ${sectorStateClass(r.state)}${m.degenerate?' st-deg':''}">${escapeHtml(String(r.state||'—'))}</span>
      <span class="sector-labels">${sectorLabelDots(r.labels)}</span>
      ${r.stale?'<span class="sector-stale-tag">陈旧</span>':''}
      <span class="chevron">▸</span>
    </div>
    <div class="sector-metrics" title="${escapeHtml(tip)}">${metrics}</div>
    ${hint?`<div class="sector-hint">${hint}</div>`:''}
    <div class="sector-etf-body"></div>
  </div>`;
}

function sectorListHtml(rows, accCounts, pools){
  return `<div class="sector-list">${rows.map(r=>sectorRowHtml(r, accCounts, pools)).join('')}</div>`;
}

function sectorThemeHtml(rows){
  const accCounts = (sectorState && sectorState.accCounts) || new Map();
  const sums = sectorThemeSummaries(rows, SECTOR_THEME_ORDER);
  const covered = sums.map(s=>{
    if(!s.rows.length) return `<div class="sector-theme-item"><span class="t">${escapeHtml(s.theme)}</span><span class="sector-muted">本批次无映射行业</span></div>`;
    return `<div class="sector-theme-item">
      <span class="t">${escapeHtml(s.theme)}</span>
      <span class="sector-state ${sectorStateClass(s.worst.state)}">${escapeHtml(String(s.worst.state))}</span>
      <span class="sector-labels">${sectorLabelDots(s.labels)}</span>
      <span class="sector-theme-vals">${s.rows.map(r=>escapeHtml(String(r.ind))+'·'+escapeHtml(String(r.state))).join(' ')}</span>
    </div>`;
  }).join('');
  const na = SECTOR_NOT_COVERED_THEMES.map(t=>`<div class="sector-theme-item na"><span class="t">${escapeHtml(t)}</span><span class="sector-muted">A股行业ETF不覆盖</span></div>`).join('');
  return covered + na;
}

  const lines = [

function sectorCardHtml(rows){
  const accCounts = (sectorState && sectorState.accCounts) || new Map();
  const lists = sectorRankLists(rows, accCounts);
  const counts = sectorSummaryCounts(rows, accCounts); // 与 lists 同源：概要三数 == 三个榜单的行数
  const batch = (rows[0] && rows[0].batch_date) ? rows[0].batch_date : '—';
  const isStale = rows.some(r=>r.stale);
  const pools = (sectorState && sectorState.poolPools) || { l1: [], l2: [] };
  const downShown = sectorUi.showAllDown ? lists.down : lists.down.slice(0, SECTOR_DOWN_PREVIEW);
  // 榜单标题里的计数与顶部概要同一口径（入库行实数），另用注记说明其中历史不足的行数，避免两处数字打架
  const accNote = arr => {
    const a = arr.filter(sectorIsAccumulating).length;
    const d = arr.filter(r=>sectorIsDegenerate(r, accCounts)).length;
    return a ? '；含数据积累中 ' + a + (d ? '（其中 ' + d + ' 行均线不足，置底标灰）' : '') : '';
  };
  const fold = sectorFoldState(sectorUi.collapsed);
  const summary = `<div class="sector-summary">向上 <b>${counts.up}</b> · 纠缠 <b>${counts.entangled}</b> · 调整 <b>${counts.down}</b>
      · 数据积累中 <b>${counts.accumulating}</b> · 批次 ${escapeHtml(String(batch))}
      ${isStale?'<span class="sector-stale">数据陈旧(昨日批次)</span>':''}</div>`;
  // 折叠态只输出概要行（不是 display:none）—— 调整榜 74 行不进 DOM；主题映射与脚注一并收起
  if(!fold.bodyShown) return `<div class="sector-card">${summary}</div>`;
  return `<div class="sector-card">
    ${summary}
    <div class="sector-list-title">向上趋势榜 ${lists.up.length}<span class="sector-list-sub">强多头 / 多头 · 按 60 日涨跌降序 · 历史不足 250 根者已并入本榜${accNote(lists.up)} · 点开行可见本行业全部入池ETF</span></div>
    ${lists.up.length ? sectorListHtml(lists.up, accCounts, pools) : '<div class="sector-list-title sector-muted">本批次无向上行业</div>'}
    <div class="sector-list-title">调整趋势榜 ${lists.down.length}<span class="sector-list-sub">走弱 / 空头排列 · 按 60 日涨跌升序 · 历史不足 250 根者已并入本榜${accNote(lists.down)}</span></div>
    ${downShown.length ? sectorListHtml(downShown, accCounts, pools) : '<div class="sector-list-title sector-muted">本批次无调整行业</div>'}
    ${(!sectorUi.showAllDown && lists.down.length > downShown.length)
      ? `<button class="sector-more" data-sector-more="1">展开全部 ${lists.down.length} 条（跌幅最深在前）</button>` : ''}
    <div class="sector-list-title clickable" data-sector-toggle="showEntangled">纠缠 ${lists.entangled.length} 个 ${sectorUi.showEntangled?'收起 ▴':'点开 ▾'}<span class="sector-list-sub">均线未成向，不计入双榜${accNote(lists.entangled)}</span></div>
    ${sectorUi.showEntangled ? sectorListHtml(lists.entangled, accCounts, pools) : ''}
    <div class="sector-list-title">持仓主题映射<span class="sector-list-sub">取映射行业最差状态</span></div>
    <div class="sector-theme">${sectorThemeHtml(rows)}</div>
    <div class="sector-foot">${sectorFootHtml()}</div>
  </div>`;
}

function renderSectorCard(rows){
  const root = document.getElementById('sectorCardRoot');
  if(!root || !rows || !rows.length) return;
  sectorLastRows = rows;
  // 按钮住在 section-title（卡片 root 之外），重绘 innerHTML 不经过它，文案与可见性需单独同步
  setSectorFoldBtn(sectorFoldState(sectorUi.collapsed));
  root.innerHTML = sectorCardHtml(rows);
  bindSectorCard(root);
}

function sectorEtfListHtml(data, error){
  if(error) return `<div class="sector-muted">ETF 列表读取失败：${escapeHtml(String(error.message||error))}</div>`;
  const rows = data || [];
  if(!rows.length) return '<div class="sector-muted">该行业无 sector_etf_map 行（宇宙周一重建）</div>';
  return `<div class="sector-etf-row"><span class="sector-muted">本行业入池 ${rows.length} 只（按规模降序；行业分为规模加权，四因子明细见行上悬停）</span></div>` + rows.map(e=>{
    const amt = (e.amt === null || e.amt === undefined || !isFinite(Number(e.amt))) ? '—' : Number(e.amt).toFixed(1);
    return `<div class="sector-etf-row"><span>${escapeHtml(String(e.etf_code))}</span><span class="nm">${escapeHtml(String(e.etf_name||''))}</span><span class="sector-muted">规模 <em>${amt}</em> 亿</span>${e.is_rep?'<span class="sector-etf-rep">代表</span>':''}</div>`;
  }).join('');
}

// 按钮在卡片外，bindSectorCard(root) 管不到它；dataset 守一键只绑一次，避免重绘累加监听器。
function setSectorFoldBtn(fold){
  const btn = document.getElementById('sectorFoldBtn');
  if(!btn) return;
  btn.style.display = '';
  btn.textContent = fold.label;
  btn.setAttribute('aria-expanded', fold.bodyShown ? 'true' : 'false');
  if(btn.dataset.bound === '1') return;
  btn.dataset.bound = '1';
  btn.addEventListener('click', ()=>{
    sectorUi.collapsed = !sectorUi.collapsed;
    sectorWriteCollapsedPref(sectorUi.collapsed);
    setSectorFoldBtn(sectorFoldState(sectorUi.collapsed));
    // 重绘取 sectorLastRows：showAllDown / showEntangled 不清零，折前什么样折后展开就什么样
    renderSectorCard(sectorLastRows);
  });
}

function bindSectorCard(root){
  root.querySelectorAll('.sector-row').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const body = el.querySelector('.sector-etf-body');
      const chev = el.querySelector('.chevron');
      if(!body) return;
      if(body.classList.contains('open')){ body.classList.remove('open'); if(chev) chev.classList.remove('open'); return; }
      body.classList.add('open'); if(chev) chev.classList.add('open');
      if(body.dataset.loaded === '1' || !sb) return;
      body.dataset.loaded = '1';
      body.innerHTML = '<div class="sector-muted">ETF 列表加载中…</div>';
      try{
        const { data, error } = await sb.from('sector_etf_map')
          .select('etf_code,etf_name,amt,is_rep,updated_on')
          .eq('canonical_ind', el.dataset.ind).order('amt',{ascending:false}).limit(200);
        body.innerHTML = sectorEtfListHtml(data, error);
      }catch(e){ body.innerHTML = `<div class="sector-muted">ETF 列表读取异常</div>`; }
    });
  });
  const more = root.querySelector('[data-sector-more]');
  if(more) more.addEventListener('click', e=>{ e.stopPropagation(); sectorUi.showAllDown = true; renderSectorCard(sectorLastRows); });
  root.querySelectorAll('[data-sector-toggle]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const k = el.dataset.sectorToggle;
      sectorUi[k] = !sectorUi[k];
      renderSectorCard(sectorLastRows);
    });
  });
}

function setSyncUI(){
  const textEl = document.getElementById('syncText');
  const btn = document.getElementById('syncActionBtn');
  const forceBtn = document.getElementById('forceSyncBtn');
  const strip = document.getElementById('syncStrip');
  if(!textEl || !btn || !strip) return;
  if(!cloudReady){
    strip.classList.add('off');
    textEl.textContent = '云同步不可用（离线或脚本被拦截）';
    btn.style.display = 'none';
    if(forceBtn) forceBtn.style.display = 'none';
    return;
  }
  strip.classList.remove('off');
  strip.classList.toggle('err', syncState==='error');
  btn.style.display = '';
  if(forceBtn) forceBtn.style.display = '';
  
  if(!sbUser){
    textEl.textContent = '云同步：未登录';
    btn.textContent = '登录';
    if(forceBtn) forceBtn.style.display = 'none';
  } else {
    if(syncState==='syncing') textEl.textContent = '云同步：同步中…';
    else if(syncState==='ok') textEl.textContent = '云同步：已同步 ' + new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
    else if(syncState==='error') textEl.textContent = '云同步：同步失败，本地已保存' + (syncErrMsg ? '（'+syncErrMsg+'）' : '');
    else textEl.textContent = '云同步：已登录';
    btn.textContent = '退出';
  }
}

// 云端每日快照：把比本地新的净值/均线/连续天数静默应用到基金（定时任务更新后，打开页面即最新）
async function applyServerSnapshots(){
  if(!cloudReady || !sbUser) return;
  try{
    const { data, error } = await sb.from('fund_latest').select('code,nav,nav_date,ma60,ma120,streak,below_streak').eq('user_id', sbUser.id);
    if(error || !data || !data.length) return;
    let applied = 0;
    for(const row of data){
      const f = funds.find(x=>(x.fundCode||'').trim()===row.code);
      if(!f || !row.nav) continue;
      if(f.navDate && row.nav_date && String(row.nav_date) <= String(f.navDate)) continue;
      f.currentNav = parseFloat(row.nav);
      if(row.ma60!==null && row.ma60!==undefined) f.ma60 = parseFloat(row.ma60);
      if(row.ma120!==null && row.ma120!==undefined) f.ma120 = parseFloat(row.ma120);
      if(row.nav_date) f.navDate = String(row.nav_date);
      if(row.streak!==null && row.streak!==undefined) f.aboveMaStreak = row.streak;
      if(row.below_streak!==null && row.below_streak!==undefined) f.belowStreak = row.below_streak;
      applied++;
    }
    if(applied>0){
      await saveFunds();
      render();
      showToast('已自动更新 '+applied+' 只基金的净值数据');
    }
  }catch(e){}
}

// 股票云端快照：每日定时任务更新后，打开页面自动应用最新收盘价/均线
async function applyStockSnapshots(){
  if(!cloudReady || !sbUser) return;
  try{
    const { data, error } = await sb.from('stock_latest').select('code,name,close,price_date,ma20,ma60,ma120,below_streak').eq('user_id', sbUser.id);
    if(error || !data || !data.length) return;
    let applied = 0;
    let nameFixed = 0;
    for(const row of data){
      const s = stocks.find(x=>(x.code||'').trim()===row.code);
      if(!s) continue;
      // 名称修复不受日期限制：云端旧数据曾用代码兜底当名称，纯数字名称一律以权威名称覆盖
      if(row.name && (!s.name || /^\d+$/.test(s.name))){ s.name = row.name; nameFixed++; }
      if(!row.close) continue;
      if(s.priceDate && row.price_date && String(s.priceDate) >= String(row.price_date)) continue;
      s.currentPrice = parseFloat(row.close);
      if(row.ma20!==null && row.ma20!==undefined) s.ma20 = parseFloat(row.ma20);
      if(row.ma60!==null && row.ma60!==undefined) s.ma60 = parseFloat(row.ma60);
      if(row.ma120!==null && row.ma120!==undefined) s.ma120 = parseFloat(row.ma120);
      if(row.below_streak!==null && row.below_streak!==undefined) s.belowStreak = row.below_streak;
      if(row.price_date) s.priceDate = String(row.price_date);
      applied++;
    }
    if(applied>0 || nameFixed>0){
      await saveStocks();
      render();
      if(applied>0) showToast('已自动更新 '+applied+' 只股票的行情数据');
    }
  }catch(e){}
}

// 打开页面/登录后：按更新时间取新——云端新则采用，本地新或云端为空则推送
async function syncOnOpen(){
  if(!cloudReady || !sbUser) return;
  if(Date.now()-lastPullAt < 3000) return;
  lastPullAt = Date.now();
  syncState = 'syncing'; setSyncUI();
  console.log('[定投信号台] 开始云同步...');
  try{
    const { data, error } = await sb.from(TABLE_NAME).select('data,updated_at').eq('user_id', sbUser.id).maybeSingle();
    if(error) throw error;
    const localTs = localSavedAt();
    console.log('[定投信号台] 本地保存时间:', localTs);
    console.log('[定投信号台] 云端更新:', data ? data.updated_at : '无数据');
    
    if(data && data.data && (!localTs || new Date(data.updated_at) >= new Date(localTs))){
      const d = data.data;
      console.log('[定投信号台] 云端数据 - 基金数:', Array.isArray(d.funds) ? d.funds.length : 0);
      console.log('[定投信号台] 云端数据 - 股票数:', Array.isArray(d.stocks) ? d.stocks.length : 0);
      
      if(Array.isArray(d.funds)) funds = d.funds;
      if(d.themeCaps && typeof d.themeCaps==='object') themeCaps = {...DEFAULT_CAPS, ...d.themeCaps};
      migrateThemeCaps();
      if(Array.isArray(d.stocks)) stocks = d.stocks;
      if(d.settings && typeof d.settings==='object'){
        if(d.settings.goal) goal = d.settings.goal;
        if(d.settings.stockCap !== undefined) stockCap = d.settings.stockCap || 0;
      }
      migrateFunds();
      try{
        await store.set(STORE_KEY, JSON.stringify(funds));
        await store.set(THEME_CAP_KEY, JSON.stringify(themeCaps));
        await store.set(STOCKS_KEY, JSON.stringify(stocks));
        await store.set(SETTINGS_KEY, JSON.stringify({goal, stockCap}));
        await markLocalSaved();
      }catch(e){}
      console.log('[定投信号台] 同步完成，准备渲染');
      render();
      ensureBenchmarkData();
      syncState = 'ok'; syncErrMsg=''; setSyncUI();
      applyServerSnapshots();
      applyStockSnapshots();
      autoRefreshAll(true); // 拉取云端后 force 再刷一次：确保最新净值与回算的连续天数不被旧云端快照覆盖丢失
      return;
    }
    console.log('[定投信号台] 本地数据更新，准备推送到云端');
    await pushCloud(true);
    applyServerSnapshots();
    applyStockSnapshots();
    autoRefreshAll(true);
  }catch(e){
    console.error('[定投信号台] 同步失败:', e);
    syncState = 'error';
    syncErrMsg = cloudErrHint(e);
    setSyncUI();
    autoRefreshAll(); // 同步失败也要刷新本地数据，不阻塞信号计算
  }
}

// 整包推送到云端（最后保存者胜）
async function pushCloud(silent){
  if(!cloudReady || !sbUser) return;
  syncState = 'syncing'; setSyncUI();
  try{
    const { error } = await sb.from(TABLE_NAME).upsert({ user_id: sbUser.id, data: { funds, themeCaps, stocks, settings: { goal, stockCap } }, updated_at: new Date().toISOString() });

    await markLocalSaved();
    syncState = 'ok'; syncErrMsg='';

    syncState = 'error';

  }
  setSyncUI();
}

// 大盘档位：阈值按指数波动设定（波动大的指数放宽），dev 为较双均线平均偏离
function marketLevel(dev, th){
  th = th || [-8,-3,3,8];
  if(dev<=th[0]) return {level:'deep-low',  label:'深度低位', coef:1.5};
  if(dev<=th[1]) return {level:'low',       label:'低位',     coef:1.25};
  if(dev>=th[3]) return {level:'deep-high', label:'明显高位', coef:0.5};
  if(dev>=th[2]) return {level:'high',      label:'高位',     coef:0.75};
  return {level:'neutral', label:'中性', coef:1};
}
function mktPillClass(level){
  switch(level){
    case 'deep-low': return 'pill-double';
    case 'low': return 'pill-strong';
    case 'high': return 'pill-half';
    case 'deep-high': return 'pill-pause';
    default: return 'pill-normal';
  }
}
function fmtSigned(n, digits=1){
  return (n>=0?'+':'') + n.toFixed(digits) + '%';
}

// K线 JSONP 抓取：东财主站+数字前缀镜像轮换，单域名失败自动换下一个（网络波动兜底）
function fetchKlineJsonp(secid, fqt, lmt){
  return new Promise((resolve, reject)=>{
    const hosts = ['push2his.eastmoney.com','1.push2his.eastmoney.com','23.push2his.eastmoney.com','92.push2his.eastmoney.com'];
    let i = 0;
    const tryNext = ()=>{
      if(i >= hosts.length){ reject(new Error('all kline hosts failed')); return; }
      const host = hosts[i++];
      const cbName = 'kcb' + Math.random().toString(36).slice(2,10);
      let settled = false;
      const script = document.createElement('script');
      const cleanup = ()=>{ try{ delete window[cbName]; }catch(e){} if(script.parentNode) script.parentNode.removeChild(script); };
      const timer = setTimeout(()=>{ if(settled) return; settled = true; cleanup(); tryNext(); }, 8000);
      window[cbName] = (j)=>{
        if(settled) return; settled = true; clearTimeout(timer); cleanup();
        if(j && j.data && j.data.klines && j.data.klines.length) resolve(j);
        else tryNext();
      };
      script.onerror = ()=>{ if(settled) return; settled = true; clearTimeout(timer); cleanup(); tryNext(); };
      script.src = 'https://'+host+'/api/qt/stock/kline/get?secid='+secid+'&fields1=f1,f2,f3,f4,f5,f6&fields2=f51,f53&klt=101&fqt='+fqt+'&lmt='+lmt+'&end=20500101&cb='+cbName+'&_='+Date.now();
      document.head.appendChild(script);
    };
    tryNext();
  });
}

function fetchBenchmark(key){
  const b = BENCHMARKS[key];
  if(!b) return;
  mktFetching[key] = true;
  const markFailed = ()=>{
    mktMap[key] = {ready:false, failed:true, close:null, dev:null, level:'neutral', label:'中性', coef:1};
    renderMktStrip();
  };
  fetchKlineJsonp(b.secid, 1, 130).then(j=>{
    mktFetching[key] = false;
    const closes = j.data.klines.map(s=>parseFloat(s.split(',')[1])).filter(n=>!isNaN(n));
    if(closes.length < 60){ markFailed(); return; }
    const close = closes[closes.length-1];
    const ma60 = closes.slice(-60).reduce((a,x)=>a+x,0)/60;
    const ma120 = closes.length>=120 ? closes.slice(-120).reduce((a,x)=>a+x,0)/120 : null;
    const devs = [(close-ma60)/ma60*100];
    if(ma120!==null) devs.push((close-ma120)/ma120*100);
    const dev = devs.reduce((a,x)=>a+x,0)/devs.length;
    mktMap[key] = {ready:true, failed:false, close, dev, ...marketLevel(dev, b.th)};
    renderMktStrip();
    renderFundList();
  }).catch(()=>{
    mktFetching[key] = false;
    markFailed();
  });
}

function renderMktStrip(){
  const itemsEl = document.getElementById('mktItems');
  if(!itemsEl) return;
  itemsEl.innerHTML = benchmarksInUse().map(k=>{
    const b = BENCHMARKS[k];
    const m = mktMap[k];

      return '<span class="mkt-item">'+b.name+'：'+(m && m.failed ? '获取失败' : '获取中…')+'</span>';

    return '<span class="mkt-item"><span class="signal-pill '+mktPillClass(m.level)+'">'+b.name+'·'+m.label+'</span>'
      + m.close.toFixed(2) + '（' + fmtSigned(m.dev) + '，×'+m.coef+'）</span>';
  }).join('');
}

function fmtMoney(n){

function fmtWan(n){

function fmtPct(n, digits=1){

// 每份成本：优先用「持仓成本净值」；只填「持仓总成本」时按 份额=市值/当前净值 折算
function effectiveCost(f){
  if(f.costBasis && f.costBasis>0) return f.costBasis;
  if(f.costTotal && f.costTotal>0 && f.currentNav>0 && f.marketValue>0){
    return f.costTotal/(f.marketValue/f.currentNav);
  }
  return 0;
}

function computeReturn(f){
  const cost = effectiveCost(f);
  if(!cost) return null;
  return (f.currentNav - cost)/cost*100;
}

function computeDeviation(f){
  const devs = [];
  if(f.ma60 && f.ma60>0) devs.push((f.currentNav-f.ma60)/f.ma60*100);
  if(f.ma120 && f.ma120>0) devs.push((f.currentNav-f.ma120)/f.ma120*100);
  if(devs.length===0) return null;
  return devs.reduce((a,b)=>a+b,0)/devs.length;
}

function themeMarketValue(themeName){
  return funds.filter(f=>f.theme===themeName).reduce((s,f)=> s + (parseFloat(f.marketValue)||0), 0);
}

// 主题上限 = 上限% × 目标总额（冻结锚定 GOAL，按当前市值计量；超限仅停新增）
function themeCapAmount(themeName){
  return (themeCaps[themeName] ?? 100)/100*goal;
}

// Core signal engine. Returns {level, label, multiplier, reasons:[]}
function baseSignal(f){
  const dev = computeDeviation(f);
  const pct = f.valuationPercentile===''||f.valuationPercentile===undefined||f.valuationPercentile===null ? null : parseFloat(f.valuationPercentile);
  let score = 0;
  const reasons = [];

  if(dev!==null){
    if(dev<=-15){ score+=2; reasons.push('净值较均线偏离 '+dev.toFixed(1)+'%，深度低于均线'); }
    else if(dev<=-5){ score+=1; reasons.push('净值较均线偏离 '+dev.toFixed(1)+'%，低于均线'); }
    else if(dev>=10){ score-=2; reasons.push('净值较均线偏离 +'+dev.toFixed(1)+'%，明显高于均线'); }
    else if(dev>=3){ score-=1; reasons.push('净值较均线偏离 +'+dev.toFixed(1)+'%，略高于均线'); }
    else { reasons.push('净值贴近均线（偏离 '+dev.toFixed(1)+'%）'); }
  } else {
    reasons.push('未填写均线数据，偏离度信号缺省为中性');
  }

  if(pct!==null && !isNaN(pct)){
    if(pct<=20){ score+=2; reasons.push('估值百分位 '+pct+'%，处于低位'); }
    else if(pct<=40){ score+=1; reasons.push('估值百分位 '+pct+'%，偏低'); }
    else if(pct>=80){ score-=2; reasons.push('估值百分位 '+pct+'%，处于高位'); }
    else if(pct>=60){ score-=1; reasons.push('估值百分位 '+pct+'%，偏高'); }
    else { reasons.push('估值百分位 '+pct+'%，中性'); }
  }

  let level, label, multiplier;
  if(score>=3){ level='double'; label='双倍'; multiplier=2; }
  else if(score>=1){ level='strong'; label='加强'; multiplier=1.5; }
  else if(score>=-1){ level='normal'; label='正常'; multiplier=1; }
  else if(score>=-3){ level='half'; label='减半'; multiplier=0.5; }
  else { level='pause'; label='暂停'; multiplier=0; }

  return {level, label, multiplier, reasons};
}

// ===================== 百分位 + 回撤双信号（对照策略） =====================
// 回撤加仓阶梯（相对每期基数的累计%）：5/10/15/20/35/50 各档触发后累加，总上限 60%
const DD_STEPS = [ {dd:50, add:60}, {dd:35, add:40}, {dd:20, add:30}, {dd:15, add:20}, {dd:10, add:10}, {dd:5, add:5} ];
function ddAddPct(dd){ for(const s of DD_STEPS){ if(dd>=s.dd) return s.add; } return 0; }
// 估值百分位五档：用滚动百分位替代固定 PE 绝对值，避免估值中枢漂移导致阈值失效
function pctTier(pct){
  if(pct===null || pct===undefined || isNaN(pct)) return null;
  if(pct<=20) return {label:'双倍', coef:2,   desc:'低估区'};
  if(pct<=40) return {label:'加强', coef:1.5, desc:'偏低估'};
  if(pct<60)  return {label:'正常', coef:1,   desc:'中性'};
  if(pct<80)  return {label:'减半', coef:0.5, desc:'偏高估'};
  return {label:'暂停', coef:0,   desc:'高估区'};
}
function drawdownFrom(high, price){
  if(!(high>0) || !(price>0)) return null;
  return price>=high ? 0 : (high-price)/high*100;
}
// 仲裁规则：百分位≥80（高估区）时回撤加仓失效——盈利衰退期的下跌不单独追跌
function dualSignal(pct, dd){
  const pt = pctTier(pct);
  const reasons = [];
  let addPct = 0, vetoed = false;
  if(pt) reasons.push('估值百分位 '+pct+'% → '+pt.desc+'·'+pt.label);
  else reasons.push('未填估值百分位 · 仅按回撤信号');
  if(dd===null){
    reasons.push('52周高点未记录 · 回撤信号缺省（点「自动获取」或手动填写）');
  } else {
    addPct = ddAddPct(dd);
    if(addPct>0 && pt && pt.coef===0){
      vetoed = true; addPct = 0;
      reasons.push('回撤 '+dd.toFixed(1)+'% 已达加仓档，但百分位≥80 高估 → 仲裁规则禁止加仓（不追跌）');
    } else if(addPct>0){
      reasons.push('较52周高点回撤 '+dd.toFixed(1)+'% → 累计加仓 +'+addPct+'%');
    } else {
      reasons.push('较52周高点回撤 '+dd.toFixed(1)+'%，未触发加仓');
    }
  }
  const total = (pt?pt.coef:1) + addPct/100;
  let label;
  if(total>=2) label = addPct>0 ? '双倍+' : '双倍';
  else if(total>1) label='加强';
  else if(total>0.75) label='正常';
  else if(total>0) label='减半';
  else label='暂停';
  return {pctTier:pt, dd, addPct, vetoed, total, label, reasons};
}
function dualPillClass(label){
  switch(label){
    case '双倍+': case '双倍': return 'pill-double';
    case '加强': return 'pill-strong';
    case '减半': return 'pill-half';
    case '暂停': return 'pill-pause';
    default: return 'pill-normal';
  }
}
// 卡片上的对照信号条：百分位/回撤两项数据全无时不显示，避免噪音
function dualSignalHtml(item, price, baseAmount){
  const pct = (item.valuationPercentile==='' || item.valuationPercentile===undefined || item.valuationPercentile===null)
    ? null : parseFloat(item.valuationPercentile);
  const dd = drawdownFrom(parseFloat(item.high52w)||0, price);
  if((pct===null || isNaN(pct)) && dd===null) return '';
  const d = dualSignal(isNaN(pct)?null:pct, dd);
  const pctPill = d.pctTier ? '<span class="signal-pill '+dualPillClass(d.pctTier.label)+'">百分位·'+d.pctTier.label+'</span>' : '';
  const ddPill = dd!==null
    ? '<span class="signal-pill '+(d.addPct>0?'pill-double':(d.vetoed?'pill-pause':'pill-normal'))+'">回撤'+dd.toFixed(1)+'%'+(d.addPct>0?'·加仓+'+d.addPct+'%':(d.vetoed?'·禁加仓':''))+'</span>'
    : '';
  const amtTxt = (baseAmount>0) ? '<span class="dual-amt">双信号建议 '+fmtMoney(baseAmount*d.total)+'/期（×'+d.total.toFixed(2)+'）</span>' : '';
  return '<div class="dual-strip"><span class="dual-tag">双信号对照</span>'+pctPill+ddPill
    + '<span class="signal-pill '+dualPillClass(d.label)+'">综合·'+d.label+'</span>'+amtTxt+'</div>'
    + '<div class="signal-reason" style="padding-top:0;">' + d.reasons.join('；') + '</div>';
}

function evalFundSignal(f){
  // 1. QDII premium independent trigger
  if(f.isQDII && f.qdiiPremium!=='' && f.qdiiPremium!==undefined && !isNaN(parseFloat(f.qdiiPremium))){
    const prem = parseFloat(f.qdiiPremium);
    if(prem >= 2){
      return {level:'pause', label:'暂停', multiplier:0, reasons:['QDII溢价率 '+prem+'%，触发独立暂停条件（≥2%）'], forced:true};
    }
  }

  // 2. Theme cap check：金额口径（主题市值 vs 上限%×GOAL）
  const themeMv = themeMarketValue(f.theme);
  const capAmount = themeCapAmount(f.theme);
  const capExceeded = themeMv >= capAmount;

  // 3. Manual pause / resume logic
  if(f.manualPause){
    const ret = computeReturn(f);
    const streak = f.aboveMaStreak || 0;
    const need = f.resumeRule?.requireDays ?? 3;
    const mode = f.resumeRule?.mode ?? 'ma_only';
    const targetDD = f.resumeRule?.targetDrawdown;
    const maOk = streak >= need;
    let ddOk = true;
    if(mode!=='ma_only' && targetDD!==null && targetDD!==undefined && targetDD!==''){
      ddOk = ret!==null && ret <= -Math.abs(parseFloat(targetDD));
    }
    let satisfied;
    if(mode==='ma_only') satisfied = maOk;
    else if(mode==='ma_and_drawdown') satisfied = maOk && ddOk;
    else satisfied = maOk || ddOk; // ma_or_drawdown

    if(satisfied){
      const base = baseSignal(f);
      return {
        level:'resume-ready', label:'满足恢复条件 → 建议'+base.label, multiplier:base.multiplier,
        reasons:['已连续 '+streak+'/'+need+' 个交易日站上60日均线' + (mode!=='ma_only' ? (ddOk? '，且已达目标跌幅':'，但未达目标跌幅') : '')].concat(base.reasons),
        resumeReady:true, resumeSignal:base
      };
    } else {
      const ddText = (targetDD!==null && targetDD!==undefined && targetDD!=='') ? `，目标跌幅 ${-Math.abs(parseFloat(targetDD))}%（当前 ${ret!==null?ret.toFixed(1):'--'}%）` : '';
      return {
        level:'pause', label:'暂停中', multiplier:0,
        reasons:['已连续 '+streak+'/'+need+' 个交易日站上60日均线，尚未满足恢复条件'+ddText],
        paused:true
      };
    }
  }

  if(capExceeded){
    const capPct = themeCaps[f.theme] ?? 100;
    return {level:'pause', label:'暂停（仓位超限）', multiplier:0, reasons:['该主题市值 '+fmtWan(themeMv)+'，已达/超过金额上限 '+fmtWan(capAmount)+'（目标的 '+capPct+'%），暂停新增'], forced:true};
  }

  return baseSignal(f);
}

function profitTakingAlert(f){
  const ret = computeReturn(f);
  if(ret===null || ret<=0) return null;
  const tiers = f.profitTiers && f.profitTiers.length ? f.profitTiers : DEFAULT_TIERS;
  let hit = null;
  for(const t of tiers){ if(ret >= t.ret) hit = t; }
  if(!hit) return null;
  const takenKey = 'taken_'+hit.ret;
  if(f.profitTaken && f.profitTaken.includes(hit.ret)) return null;
  return {tier:hit, ret};
}

function pillClass(level){
  switch(level){
    case 'double': return 'pill-double';
    case 'strong': return 'pill-strong';
    case 'normal': return 'pill-normal';
    case 'half': return 'pill-half';
    case 'resume-ready': return 'pill-strong';
    default: return 'pill-pause';
  }
}

function stockMvOf(s){ return (parseFloat(s.shares)||0) * (parseFloat(s.currentPrice)||0); }
function exchangeLabel(code){
  code = String(code||'');
  if(/^\d{5}$/.test(code)) return '港股';
  if(code.startsWith('6')) return '沪A';
  return '深A';
}
function stockTierLabel(dev){
  if(dev===null || dev===undefined) return '缺数据';
  let score = 0;
  if(dev<=-15) score+=2; else if(dev<=-5) score+=1; else if(dev>=10) score-=2; else if(dev>=3) score-=1;
  if(score>=3) return '双倍';
  if(score>=1) return '加强';
  if(score>=-1) return '正常';
  if(score>=-3) return '减半';
  return '暂停';
}
