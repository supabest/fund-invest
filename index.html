// 股票行情自动获取：K线 JSONP 多线路轮换（浏览器直连），填名称/现价/均线并静默存档
function autoFetchStockData(id){
  const s = stocks.find(x=>x.id===id);
  const body = document.getElementById('sbody-'+id);
  const statusEl = body ? body.querySelector('[data-wrap="stockFetchStatus"]') : null;
  const code = (body ? (body.querySelector('[data-sk="code"]').value||'') : (s?s.code:'')).trim();
  const setStatus = (text, color)=>{ if(statusEl){ statusEl.textContent = text; statusEl.style.color = color || 'var(--muted)'; } };
  if(!/^\d{5,6}$/.test(code)){ setStatus('请先填写 5-6 位代码（A股6位/港股5位）', 'var(--brick)'); return; }
  const secid = code.length===5 ? ('116.'+code) : (code.startsWith('6') ? ('1.'+code) : ('0.'+code));
  setStatus('正在获取行情（多线路自动重试）…');
  fetchKlineJsonp(secid, 1, 260).then(j=>{
    const rows = j.data.klines.map(kl=>{ const [dd,cc]=kl.split(','); return { date:dd, close:parseFloat(cc) }; });
    const closes = rows.map(x=>x.close);
    const cur = rows[rows.length-1];
    const ma20 = closes.length>=20 ? closes.slice(-20).reduce((a,b)=>a+b,0)/20 : null;
    const ma60 = closes.length>=60 ? closes.slice(-60).reduce((a,b)=>a+b,0)/60 : null;
    const ma120 = closes.length>=120 ? closes.slice(-120).reduce((a,b)=>a+b,0)/120 : null;
    const recentCloses = closes.slice(-250);
    const high52w = recentCloses.length ? recentCloses.reduce((a,b)=>Math.max(a,b)) : null;
    let above=0, below=0;
    if(ma60!==null){
      for(let i=closes.length-1;i>=59;i--){
        const m = closes.slice(i-59,i+1).reduce((a,b)=>a+b,0)/60;
        if(closes[i]>=m){ if(below===0) above++; else break; } else { if(above===0) below++; else break; }
      }
    }
    const target = stocks.find(x=>x.id===id);
    if(!target) return;
    target.code = code;
    target.currentPrice = cur.close;
    target.priceDate = cur.date;
    if(ma20!==null) target.ma20 = ma20;
    if(ma60!==null) target.ma60 = ma60;
    if(ma120!==null) target.ma120 = ma120;
    if(high52w!==null) target.high52w = high52w;
    target.belowStreak = below;
    const jname = (j.data && j.data.name) || '';
    const nameInput = body ? body.querySelector('[data-sk="name"]') : null;
    if(jname && nameInput && (!nameInput.value.trim() || /^\d+$/.test(nameInput.value.trim()))) nameInput.value = jname;
    if(jname && (!target.name || /^\d+$/.test(target.name))) target.name = jname;
      saveStocks();
      const titleEl = document.querySelector('.fund-head[data-sid="'+id+'"] .fund-name');
      if(titleEl) titleEl.textContent = target.name || '未命名股票';
      const hInput = body ? body.querySelector('[data-sk="high52w"]') : null;
      if(hInput && high52w!==null) hInput.value = high52w.toFixed(3);
      setStatus('已获取 '+jname+' '+cur.date+' 收盘价 '+cur.close.toFixed(2)+(ma60?'，MA60='+ma60.toFixed(2):'')+(ma120?'，MA120='+ma120.toFixed(2):'')+(high52w?'，52周高点='+high52w.toFixed(2):'')+'。点击「保存」后卡片同步。', 'var(--jade)');
  }).catch(()=>{
    setStatus('多线路均获取失败（网络波动）。行情也会由每日定时任务自动更新，稍后打开即为最新。', 'var(--brick)');
  });
}

async function saveStockForm(id){

  s.shares = parseFloat(get('shares').value)||0;
  s.cost = parseFloat(get('cost').value)||0;

  const shv = String(get('high52w').value||'').trim();
  if(shv!=='') s.high52w = parseFloat(shv)||0;
  const ptStock = get('tierPreset');
  const psv = ptStock ? ptStock.value : '';
  if(psv && TIER_PRESETS[psv]){
    s.profitTiers = TIER_PRESETS[psv].tiers.split(',').map(x=>{ const seg = x.split(':').map(Number); return { ret: seg[0], sell: seg[1] }; });
  } else if(!s.profitTiers || !s.profitTiers.length){
    s.profitTiers = DEFAULT_TIERS;
  }
  if(s.shares>0 && s.currentPrice>0) s.marketValue = stockMvOf(s);
  await saveStocks();
  showToast('已保存，行情将于下一轮自动更新');
  toggleStockBody(id); toggleStockBody(id);
  render();
}

async function deleteStock(id){
  if(!confirm('确认删除这只股票的所有记录？')) return;
  stocks = stocks.filter(x=>x.id!==id);

}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function toggleFundBody(id){
  const body = document.getElementById('body-'+id);

  const isOpen = body.classList.contains('open');

    body.classList.remove('open');
    chev.classList.remove('open');

  }

function bindFundBody(id){
  const body = document.getElementById('body-'+id);
  body.querySelector('[data-action="save"]').addEventListener('click', ()=> saveFundForm(id));
  body.querySelector('[data-action="delete"]').addEventListener('click', ()=> deleteFund(id));
  const fetchBtn = document.getElementById('autoFetchBtn-'+id);
  if(fetchBtn) fetchBtn.addEventListener('click', ()=> autoFetchFundData(id));
  // 市值 = 份额×净值，实时联动；成本两栏二选一，另一栏自动折算
  const mvInput = body.querySelector('[data-k="mvDisplay"]');
  const sharesEl = body.querySelector('[data-k="shares"]');
  const navEl = body.querySelector('[data-k="currentNav"]');
  const cbEl = body.querySelector('[data-k="costBasis"]');
  const ctEl = body.querySelector('[data-k="costTotal"]');
  const recalc = ()=>{
    mvInput.value = fmtMoney((parseFloat(sharesEl.value)||0) * (parseFloat(navEl.value)||0));
  };
  const syncCostPair = (source)=>{
    const sh = parseFloat(sharesEl.value)||0;
    if(source==='basis'){
      const v = parseFloat(cbEl.value);
      if(!isNaN(v) && sh>0) ctEl.value = (v*sh).toFixed(2);
      else if(cbEl.value==='') ctEl.value='';
    } else {
      const v = parseFloat(ctEl.value);
      if(!isNaN(v) && sh>0) cbEl.value = (v/sh).toFixed(4);
      else if(ctEl.value==='') cbEl.value='';
    }
  };
  sharesEl.addEventListener('input', ()=>{
    recalc();
    if(cbEl.value!=='' ) syncCostPair('basis');
    else if(ctEl.value!=='') syncCostPair('total');
  });
  navEl.addEventListener('input', recalc);
  cbEl.addEventListener('input', ()=>syncCostPair('basis'));
  ctEl.addEventListener('input', ()=>syncCostPair('total'));
}

// 名称特征：QDII 基金名称含 (QDII) 或海外市场标识；沪港深/港股通基金非 QDII
function detectFundTraits(name){
  const n = String(name||'');
  const overseas = /(QDII|美元|纳斯达克|纳指|标普|道琼斯|日经|美国|亚太|海外|新兴市场|欧洲|德国|法国|印度|越南|原油|黄金|大宗商品|全球)/i.test(n);
  const hkConnect = /(沪港深|港股通)/.test(n);
  let benchmark = null;
  if(/纳斯达克|纳指/.test(n)) benchmark = 'NDX';
  else if(/标普/.test(n)) benchmark = 'SPX';
  else if(/道琼斯/.test(n)) benchmark = 'DJIA';
  else if(/恒生科技/.test(n)) benchmark = 'HSTECH';
  else if(/恒生/.test(n)) benchmark = 'HSI';
  return { isQDII: overseas && !hkConnect, benchmark };
}
// 应用识别结果：QDII 标记只置真不撤销（保留历史手动标记）；指数建议仅在仍是默认沪深300时生效
function applyFundTraits(id, traits, source){
  const f = funds.find(x=>x.id===id);
  if(!f) return;
  const body = document.getElementById('body-'+id);
  f.isQDII = (traits.isQDII===true) || f.isQDII === true;
  const wrap = body && body.querySelector('[data-wrap="qdiiWrap"]');
  if(wrap) wrap.style.display = f.isQDII ? '' : 'none';
  const note = body && body.querySelector('[data-wrap="qdiiNote"]');
  if(note) note.textContent = f.isQDII ? '✓ 已自动识别为 QDII 基金（'+source+'）' : 'QDII 身份自动识别，无需手动勾选';
  if(traits.benchmark){
    const sel = body && body.querySelector('select[data-k="benchmark"]');
    if(sel && sel.value==='HS300'){
      f.benchmark = traits.benchmark;
      sel.value = traits.benchmark;
      ensureBenchmarkData();
      if(note) note.textContent += '；参考指数已按名称设为'+BENCHMARKS[traits.benchmark].name;
    }
  }
}

// 数据源：天天基金静态文件 fund.eastmoney.com/pingzhongdata/<6位代码>.js。
// 用 <script> 标签加载不受 CORS 限制，该文件也无 Referer 校验，因此本地直接
// 打开本页面即可自动获取。内容为 var 声明：fS_name（基金名）、fS_code、
// Data_netWorthTrend（[{x:毫秒时间戳, y:单位净值}, ...]，按时间升序）。
// 注意：带 CSP 的 artifact 沙盒会拦截外部脚本，此功能仅在本地浏览器可用。
function autoFetchFundData(id){
  const statusEl = document.getElementById('autoFetchStatus-'+id);
  const body = document.getElementById('body-'+id);
  const code = (body.querySelector('[data-k="fundCode"]').value||'').trim();
  if(!/^\d{6}$/.test(code)){
    statusEl.textContent = '请先填写6位场外基金代码';
    statusEl.style.color = 'var(--brick)';
    return;
  }
  statusEl.textContent = '正在获取历史净值…';
  statusEl.style.color = 'var(--muted)';

  const script = document.createElement('script');
  let settled = false;
  const cleanup = ()=>{ if(script.parentNode) script.parentNode.removeChild(script); };
  const fail = (msg)=>{
    if(settled) return;
    settled = true;
    clearTimeout(timeoutId);
    cleanup();
    statusEl.textContent = msg;
    statusEl.style.color = 'var(--brick)';
  };
  const timeoutId = setTimeout(()=> fail('获取超时（无网络或代码不存在），请手动填写净值与均线。'), 10000);

  script.onload = ()=>{
    try{
      const trend = window.Data_netWorthTrend;
      const fname = window.fS_name;
      if(!trend || !trend.length) throw new Error('empty');
      settled = true;
      clearTimeout(timeoutId);
      cleanup();

      const navs = trend.map(p=>parseFloat(p.y)).filter(n=>!isNaN(n));
      const last = trend[trend.length-1];
      const d = new Date(last.x);
      const dateStr = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
      const current = navs[navs.length-1];
      const ma60 = navs.length>=60 ? navs.slice(-60).reduce((a,b)=>a+b,0)/60 : null;
      const ma120 = navs.length>=120 ? navs.slice(-120).reduce((a,b)=>a+b,0)/120 : null;
      // 52周（约250个交易日）最高净值：供双信号对照的回撤档使用
      const recentNavs = navs.slice(-250);
      const high52w = recentNavs.length ? recentNavs.reduce((a,b)=>Math.max(a,b)) : null;

      const nameInput = body.querySelector('[data-k="name"]');
      if(fname && !nameInput.value.trim()) nameInput.value = fname;
      const fundObj = funds.find(x=>x.id===id);
      if(fundObj) fundObj.navDate = dateStr;
      if(fname){
        applyFundTraits(id, detectFundTraits(fname), '名称特征');
        fetchFundType(id, code);
      }
      body.querySelector('[data-k="currentNav"]').value = current.toFixed(4);
      body.querySelector('[data-k="currentNav"]').dispatchEvent(new Event('input'));
      if(ma60!==null) body.querySelector('[data-k="ma60"]').value = ma60.toFixed(4);
      if(ma120!==null) body.querySelector('[data-k="ma120"]').value = ma120.toFixed(4);
      if(high52w!==null){
        const hEl = body.querySelector('[data-k="high52w"]');
        if(hEl) hEl.value = high52w.toFixed(4);
        if(fundObj) fundObj.high52w = high52w;
      }

      // 按完整历史逐日回算「连续站上60日线」天数，保存时自动同步
      let streak = null;
      if(navs.length>=60){
        streak = 0;
        for(let i=navs.length-1; i>=59; i--){
          const ma = navs.slice(i-59, i+1).reduce((a,b)=>a+b,0)/60;
          if(navs[i] >= ma) streak++; else break;
        }
      }
      if(streak!==null) fetchedStreaks[id] = streak;

      let msg = '已获取最新净值 '+current.toFixed(4)+'（'+dateStr+'）';
      msg += ma60!==null ? '，MA60='+ma60.toFixed(4) : '，历史不足60天，MA60未计算';
      msg += ma120!==null ? '，MA120='+ma120.toFixed(4) : '，历史不足120天，MA120未计算';
      if(streak!==null) msg += '；按历史回算已连续 '+streak+' 日站上MA60，保存时自动同步';
      if(high52w!==null) msg += '；52周高点 '+high52w.toFixed(4);
      statusEl.textContent = msg;
      statusEl.style.color = 'var(--jade)';
    }catch(e){
      fail('数据解析失败（可能不是场外基金，或成立时间过短），请手动填写。');
    }
  };
  script.onerror = ()=> fail('获取被浏览器拦截或基金代码不存在，请手动填写净值与均线。');
  script.src = 'https://fund.eastmoney.com/pingzhongdata/'+code+'.js?dt='+Date.now();
  document.head.appendChild(script);
}

// ===================== 打开页面自动刷新：净值/均线/连续天数/52周高点 =====================
// 纯计算：由完整历史（净值或收盘价）回算现值、均线、连续站上/跌破60日线天数、52周高点
function computeNavMetrics(navs){
  const len = navs.length;
  if(!len) return null;
  const avg = arr => arr.reduce((a,b)=>a+b,0)/arr.length;
  const ma60 = len>=60 ? avg(navs.slice(-60)) : null;
  const ma120 = len>=120 ? avg(navs.slice(-120)) : null;
  let above = 0, below = 0;
  if(len>=60){
    for(let i=len-1;i>=59;i--){
      const ma = avg(navs.slice(i-59,i+1));
      if(navs[i]>=ma){ if(below===0) above++; else break; }
      else { if(above===0) below++; else break; }
    }
  }
  const recent = navs.slice(-250);
  const high52w = recent.length ? recent.reduce((a,b)=>Math.max(a,b)) : null;
  return { current: navs[len-1], ma60, ma120, above, below, high52w };
}
function fmtDateCN(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
// 串行加载 pingzhongdata 脚本：它写的是全局变量，必须一只加载完立即读取再加载下一只
function loadFundNavScript(code){
  return new Promise((resolve, reject)=>{
    const script = document.createElement('script');
    let settled = false;
    const cleanup = ()=>{ if(script.parentNode) script.parentNode.removeChild(script); };
    const timer = setTimeout(()=>{ if(settled) return; settled=true; cleanup(); reject(new Error('timeout')); }, 12000);
    script.onload = ()=>{
      if(settled) return; settled = true; clearTimeout(timer);
      const trend = window.Data_netWorthTrend;
      cleanup();
      if(trend && trend.length) resolve(trend); else reject(new Error('empty'));
    };
    script.onerror = ()=>{ if(settled) return; settled=true; clearTimeout(timer); cleanup(); reject(new Error('load fail')); };
    script.src = 'https://fund.eastmoney.com/pingzhongdata/'+code+'.js?dt='+Date.now();
    document.head.appendChild(script);
  });
}
async function autoRefreshFunds(){
  const ids = funds.filter(f=>/^\d{6}$/.test(String(f.fundCode||'').trim())).map(f=>f.id);
  let updated = 0;
  for(const id of ids){
    const f = funds.find(x=>x.id===id);
    if(!f) continue;
    const body = document.getElementById('body-'+id);
    if(body && body.classList.contains('open')) continue; // 正在编辑的基金不覆盖
    let trend = null;
    try{ trend = await loadFundNavScript(String(f.fundCode).trim()); }catch(e){ continue; }
    const rows = trend.map(p=>({ y: parseFloat(p.y), t: p.x })).filter(r=>!isNaN(r.y) && r.t);
    if(!rows.length) continue;
    const lastDate = fmtDateCN(new Date(rows[rows.length-1].t));
    if(f.navDate && String(f.navDate) > lastDate) continue; // 本地/云端快照更新，不回退
    const m = computeNavMetrics(rows.map(r=>r.y));
    if(!m) continue;
    f.currentNav = Math.round(m.current*10000)/10000;
    if(m.ma60!==null) f.ma60 = Math.round(m.ma60*10000)/10000;
    if(m.ma120!==null) f.ma120 = Math.round(m.ma120*10000)/10000;
    f.navDate = lastDate;
    f.aboveMaStreak = m.above;   // 按完整历史回算，纠正手工/云端可能不准的天数
    f.belowStreak = m.below;
    if(m.high52w!==null) f.high52w = Math.round(m.high52w*10000)/10000;
    if(f.shares>0) f.marketValue = Math.round(f.shares * f.currentNav * 100)/100;
    updated++;
  }
  return updated;
}
async function autoRefreshStocks(){
  const targets = stocks.filter(s=>/^\d{5,6}$/.test(String(s.code||'').trim()));
  let updated = 0;
  for(const s of targets){
    const body = document.getElementById('sbody-'+s.id);
    if(body && body.classList.contains('open')) continue;
    const code = String(s.code).trim();
    const secid = code.length===5 ? ('116.'+code) : (code.startsWith('6') ? ('1.'+code) : ('0.'+code));
    try{
      const j = await fetchKlineJsonp(secid, 1, 260);
      const rows = j.data.klines.map(kl=>{ const seg = kl.split(','); return { date: seg[0], close: parseFloat(seg[1]) }; }).filter(r=>!isNaN(r.close));
      if(!rows.length) continue;
      const cur = rows[rows.length-1];
      if(s.priceDate && String(s.priceDate) > String(cur.date)) continue;
      const closes = rows.map(r=>r.close);
      const m = computeNavMetrics(closes);
      s.currentPrice = cur.close;
      s.priceDate = cur.date;
      if(closes.length>=20) s.ma20 = Math.round(closes.slice(-20).reduce((a,b)=>a+b,0)/20*1000)/1000;
      if(m.ma60!==null) s.ma60 = Math.round(m.ma60*1000)/1000;
      if(m.ma120!==null) s.ma120 = Math.round(m.ma120*1000)/1000;
      s.belowStreak = m.below;
      if(m.high52w!==null) s.high52w = Math.round(m.high52w*1000)/1000;
      if(s.shares>0) s.marketValue = stockMvOf(s);
      updated++;
    }catch(e){}
  }
  return updated;
}
let autoRefreshRunning = false;
let autoRefreshAt = 0;
async function autoRefreshAll(force){
  if(autoRefreshRunning) return;
  if(!force && Date.now()-autoRefreshAt < 60000) return; // 限频：60秒内不重复跑（focus 重入保护）
  autoRefreshRunning = true; autoRefreshAt = Date.now();
  let fN = 0, sN = 0;
  try{ fN = await autoRefreshFunds(); }catch(e){}
  try{ sN = await autoRefreshStocks(); }catch(e){}
  loadSectorRotation().catch(()=>{}); // 修复轮2（评审 I1 ②）：仍在刷新序列末尾触发（不新起定时器），但改为 fire-and-forget —— 卡片结果非 saveFunds/Toast 所需，不再把 autoRefreshRunning 锁在≤ 10 个串行 RT 上；同时在飞请求由 sectorReqGuard 序号守卫防竞态
  autoRefreshRunning = false;
  if(fN + sN > 0){
    await saveFunds();
    if(sN>0) await saveStocks();
    render();
    ensureBenchmarkData();
    showToast('已自动获取 '+fN+' 只基金净值、'+sN+' 只股票行情（均线与连续天数按完整历史回算）');
  }
}

async function saveFundForm(id){
  const f = funds.find(x=>x.id===id);
  const body = document.getElementById('body-'+id);
  const get = k => body.querySelector(`[data-k="${k}"]`);

  f.name = get('name').value.trim();
  f.theme = get('theme').value;
  f.benchmark = get('benchmark').value;
  f.shares = parseFloat(get('shares').value)||0;
  f.baseAmount = parseFloat(get('baseAmount').value)||0;
  f.costBasis = parseFloat(get('costBasis').value)||0;
  f.costTotal = parseFloat(get('costTotal').value)||0;
  f.fundCode = get('fundCode').value.trim();
  f.currentNav = parseFloat(get('currentNav').value)||0;
  f.marketValue = f.shares * f.currentNav;
  f.ma60 = parseFloat(get('ma60').value)||0;
  f.ma120 = parseFloat(get('ma120').value)||0;
  f.valuationPercentile = get('valuationPercentile').value;
  const hvRaw = String(get('high52w').value||'').trim();
  if(hvRaw!=='') f.high52w = parseFloat(hvRaw)||0;
  const qdiiEl = body.querySelector('[data-k="qdiiPremium"]');
  f.qdiiPremium = qdiiEl ? qdiiEl.value : '';
  f.manualPause = get('manualPause').checked;
  const ptSel = get('tierPreset');
  const pv = ptSel ? ptSel.value : '';
  if(pv && TIER_PRESETS[pv]){
    f.profitTiers = TIER_PRESETS[pv].tiers.split(',').map(x=>{ const seg = x.split(':').map(Number); return { ret: seg[0], sell: seg[1] }; });
  } else if(!f.profitTiers || !f.profitTiers.length){
    f.profitTiers = DEFAULT_TIERS;
  }

  const reqDays = parseInt(get('reqDays').value)||3;
  const mode = get('resumeMode').value;
  const targetDrawdown = get('targetDrawdown').value;
  f.resumeRule = { requireDays: reqDays, mode, targetDrawdown };

  const todayAbove = get('todayAboveMA').value;
  if(todayAbove==='yes') f.aboveMaStreak = (f.aboveMaStreak||0)+1;
  else if(todayAbove==='no') f.aboveMaStreak = 0;
  else if(fetchedStreaks[id]!==undefined) f.aboveMaStreak = fetchedStreaks[id];
  delete fetchedStreaks[id];

  if(!f.profitTiers) f.profitTiers = DEFAULT_TIERS;
  if(!f.profitTaken) f.profitTaken = [];

  if(f.costBasis>0 && f.currentNav>0 && f.costBasis > f.currentNav*5){
    showToast('提示：成本净值远大于当前净值，确认没把总成本金额填进成本净值？');
  }

  await saveFunds();
  ensureBenchmarkData();
  showToast('已保存');
  toggleFundBody(id);
  toggleFundBody(id);
  render();
}

document.getElementById('loginSubmitBtn').addEventListener('click', async ()=>{
  const email = document.getElementById('loginEmail').value.trim();
  const pass = document.getElementById('loginPass').value;
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ loginMsg('请输入有效邮箱','var(--brick)'); return; }
  if(pass.length<6){ loginMsg('密码至少6位','var(--brick)'); return; }
  loginMsg('正在登录…');
  // 先尝试登录；凭据不存在则自动注册
  const { error } = await sb.auth.signInWithPassword({ email, password: pass });
  if(!error){ return; } // 成功由 onAuthStateChange 接管
  if(/Invalid login credentials/i.test(error.message)){
    loginMsg('新邮箱？正在自动注册…');
    const signup = await sb.auth.signUp({ email, password: pass });
    if(signup.error){
      if(/already registered/i.test(signup.error.message)) loginMsg('该邮箱已注册，密码不对','var(--brick)');
      else if(/email_address_invalid|is invalid/i.test(signup.error.message)) loginMsg('邮箱无效：请使用真实存在的邮箱（QQ/163/Gmail 等），不能随便编一个域名','var(--brick)');
      else if(/[Rr]ate limit/i.test(signup.error.message)) loginMsg('尝试太频繁，请等几分钟再试','var(--brick)');
      else loginMsg('注册失败：'+signup.error.message,'var(--brick)');
      return;
    }
    if(signup.data.session){ return; } // 注册即登录成功
    loginMsg('项目开启了邮箱确认：请点开邮箱里的确认邮件（可能藏在垃圾箱），点确认链接后回来重新点「登录 / 注册」','var(--gold)');
    return;
  }
  if(/email_address_invalid|is invalid/i.test(error.message)) loginMsg('邮箱无效：请使用真实存在的邮箱（QQ/163/Gmail 等）','var(--brick)');
  else if(/not confirmed/i.test(error.message)) loginMsg('邮箱未确认：请先完成注册时发给你的确认邮件，再回来登录','var(--brick)');
  else if(/[Rr]ate limit/i.test(error.message)) loginMsg('尝试太频繁，请等几分钟再试','var(--brick)');
  else loginMsg('登录失败：'+error.message,'var(--brick)');
});

document.getElementById('researchGoBtn').addEventListener('click', async ()=>{
  if(!sbUser){ document.getElementById('researchMsg').textContent='请先登录（云同步账号）后使用研究功能'; openLoginModal(); return; } // spec §4：verify_jwt:true ⇒ 须登录态
  if(researchInflight) return;
  const code = document.getElementById('researchCode').value.trim();
  if(!/^\d{5,6}$/.test(code)){ document.getElementById('researchMsg').textContent='代码格式不符（A股6位/港股5位）'; return; }
  const provider = document.getElementById('researchProvider').value;
  const keyInput = document.getElementById('researchKey').value.trim();
  const cred = researchCredGet();
  const apiKey = keyInput || (cred && cred.provider===provider ? cred.key : '');
  if(!apiKey){ document.getElementById('researchMsg').textContent='请粘贴该服务商的 API Key'; return; }
  if(keyInput) researchCredSet({provider, key: keyInput}); // 仅在用户本次输入时写 sessionStorage；复用会话凭证不回写
  document.getElementById('researchMsg').textContent='';
  researchInflight = true; renderResearchResultCard({status:'running', code, provider});
  try{
    const d = await invokeResearch({action:'generate', code, provider, api_key: apiKey}); // model 不传 → 函数用默认值
    if(d && d.ok && d.row){
      fundamentals.set(String(d.row.code), d.row);
      renderResearchResultCard(d.row, !!d.cached);
      if(d.row.status==='running') startStatusPoll(code); // 撞上别人 inflight 的 running 行 → 轮询
    } else {
      const msg = (d && d.error) ? d.error : '数据获取失败';
      fundamentals.set(String(code), { code, provider, status:'failed', verdict:null, error: msg, finished_at: new Date().toISOString() }); // 终审 Minor：失败同步进 Map，使持仓卡胶囊态与结果卡一致
      renderResearchResultCard({status:'failed', code, provider, error: msg});
    }
  }catch(e){
    fundamentals.set(String(code), { code, provider, status:'failed', verdict:null, error:'数据获取失败', finished_at: new Date().toISOString() }); // 终审 Minor：失败同步进 Map
    renderResearchResultCard({status:'failed', code, provider, error:'数据获取失败'}); // 失败纪律：只报这五个字级别的信息，不带渠道细节猜测
  }finally{
    researchInflight = false;
    renderStockSection(); // 持仓卡胶囊联动（若该 code 恰是持仓）
  }
});
